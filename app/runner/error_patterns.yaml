# Типовые ошибки новичка и человеческие объяснения к ним.
#
# Это то, на что живой преподаватель отвечает мгновенно, едва взглянув на
# экран. Здесь нет и не должно быть разбора замысла — только однозначные
# случаи. Всё остальное идёт к учителю.
#
# Поля правила:
#   type    — тип исключения Python (или SyntaxError для разбора при парсинге)
#   match   — регулярное выражение по тексту ошибки (необязательно)
#   title   — короткая суть, одной строкой
#   body    — объяснение простыми словами
#   fix     — что конкретно сделать

rules:
  # --- Синтаксис ---------------------------------------------------------

  - type: SyntaxError
    match: "'\\(' was never closed"
    title: Не закрыта круглая скобка
    body: |
      Каждая открытая скобка `(` должна быть закрыта `)`. Python дошёл до
      конца файла и так и не нашёл закрывающую.
    fix: Посмотри на подсвеченную строку и добавь `)` в конце.

  - type: SyntaxError
    match: "'\\[' was never closed"
    title: Не закрыта квадратная скобка
    body: Открыли `[`, но не закрыли `]`.
    fix: Добавь `]` там, где заканчивается список.

  - type: SyntaxError
    match: "unterminated string literal"
    title: Не закрыта кавычка
    body: |
      Текст в Python пишут между кавычками: `"Привет"`. Одна кавычка есть,
      а второй нет, и Python не понимает, где текст заканчивается.
    fix: Добавь закрывающую кавычку — такую же, как открывающая.

  - type: SyntaxError
    match: "expected ':'"
    title: Забыто двоеточие
    body: |
      После `if`, `else`, `for`, `while` и `def` всегда ставится двоеточие.
      Оно означает: «дальше идёт то, что относится к этой строке».
    fix: Поставь `:` в конце подсвеченной строки.

  - type: SyntaxError
    match: "invalid syntax"
    title: Python не понял эту строку
    body: |
      Где-то в записи опечатка: лишний или пропущенный знак, неверное слово.
      Чаще всего — пропущенная запятая, скобка или двоеточие.
    fix: Сравни подсвеченную строку с примером из урока, знак за знаком.

  - type: SyntaxError
    match: "cannot assign to literal"
    title: Слева от «=» должно быть имя переменной
    body: |
      Запись `5 = x` невозможна: слева ставят имя, которому дают значение,
      а справа — само значение. Читается как «положи в коробку x число 5».
    fix: Поменяй местами — сначала имя, потом `=`, потом значение.

  - type: IndentationError
    match: "expected an indented block"
    title: Не хватает отступа
    body: |
      Строки, которые относятся к `if`, `for` или `def`, пишут с отступом
      в четыре пробела. Так Python понимает, что они внутри.
    fix: Поставь курсор в начало строки и нажми Tab.

  - type: IndentationError
    match: "unexpected indent"
    title: Лишний отступ
    body: |
      Эта строка сдвинута вправо, хотя не должна быть ни внутри условия,
      ни внутри цикла.
    fix: Убери лишние пробелы в начале строки (Shift+Tab).

  - type: IndentationError
    title: Отступы стоят неровно
    body: |
      Внутри одного блока все строки должны начинаться одинаково —
      с одного и того же отступа.
    fix: "Выровняй строки: везде по четыре пробела на уровень."

  - type: TabError
    title: Смешаны табуляция и пробелы
    body: |
      Часть отступов сделана табуляцией, часть пробелами. Выглядит
      одинаково, но для Python это разные вещи.
    fix: Выдели весь код и наберите отступы заново клавишей Tab.

  # --- Имена -------------------------------------------------------------

  - type: NameError
    match: "name 'prnt'|name 'pint'|name 'primt'|name 'Print'"
    title: Опечатка в слове print
    body: "Команда печати пишется ровно так: `print`."
    fix: Исправь написание на `print`.

  - type: NameError
    match: "name '(\\w+)' is not defined"
    title: Python не знает такого имени
    body: |
      Имя `{1}` нигде не создано. Обычно это опечатка либо переменная,
      которой ещё не присвоили значение.
    fix: Проверь написание `{1}` — буква в букву, включая большие и маленькие.

  # --- Типы --------------------------------------------------------------

  - type: TypeError
    match: "can only concatenate str \\(not \"int\"\\) to str"
    title: Нельзя склеить текст и число
    body: |
      Знак `+` для текста означает «склеить», а для чисел — «сложить».
      Смешивать их Python не умеет: он не знает, чего ты хочешь.
    fix: |
      Либо переведи число в текст: `"Тебе " + str(age)`,
      либо печатай через запятую: `print("Тебе", age)`.

  - type: TypeError
    match: "unsupported operand type\\(s\\) for -: 'str' and 'int'"
    title: Из текста нельзя вычесть число
    body: |
      То, что пришло из `input()`, — всегда текст, даже если выглядит
      как число. Вычитать из текста нельзя.
    fix: 'Оберни ввод в `int(...)`, например `age = int(input("Возраст: "))`.'

  - type: TypeError
    match: "unsupported operand type"
    title: Эти два значения так не соединить
    body: |
      Слева и справа от знака оказались разные по смыслу вещи — например,
      текст и число.
    fix: Проверь, что складываешь числа с числами, а текст с текстом.

  - type: TypeError
    match: "'str' object cannot be interpreted as an integer"
    title: Здесь нужно число, а не текст
    body: |
      `range()` считает шаги и понимает только числа. Текст, пришедший
      из `input()`, для этого не годится.
    fix: "Преобразуй значение числом: `int(...)`."

  - type: ValueError
    match: "invalid literal for int\\(\\) with base 10"
    title: Это не похоже на число
    body: |
      `int()` превращает в число только то, что состоит из цифр.
      Слово или пустая строка так не переводятся.
    fix: Убедись, что вводишь именно цифры, без букв и пробелов.

  # --- Последовательности ------------------------------------------------

  - type: IndexError
    match: "list index out of range"
    title: Нет элемента с таким номером
    body: |
      Нумерация в списках начинается с нуля: у списка из трёх элементов
      номера 0, 1 и 2. Номер 3 — уже за краем.
    fix: "Проверь номер: последний элемент имеет номер на единицу меньше длины."

  - type: KeyError
    title: В словаре нет такого ключа
    body: |
      Ты обращаешься к ключу, которого в словаре нет. Регистр важен:
      `"Имя"` и `"имя"` — разные ключи.
    fix: Проверь написание ключа или добавь его в словарь заранее.

  # --- Прочее ------------------------------------------------------------

  - type: ZeroDivisionError
    title: Деление на ноль
    body: |
      На ноль делить нельзя — это не ограничение Python, а математика.
    fix: Проверяй делитель перед делением, например через `if делитель != 0:`.

  - type: EOFError
    title: Программа ждала ввода, но его не было
    body: |
      `input()` просит что-то напечатать, но ввод закончился.
      При проверке задания данные подаёт сама программа проверки.
    fix: Убедись, что вызовов `input()` ровно столько, сколько ждёт задание.

  - type: RecursionError
    title: Функция бесконечно вызывает саму себя
    body: |
      Функция зовёт себя, и это никогда не заканчивается.
    fix: Добавь условие, при котором функция перестаёт вызывать себя.

  - type: AttributeError
    match: "'str' object has no attribute '(\\w+)'"
    title: У текста нет такого действия
    body: |
      У текста нет действия `{1}`. Возможно, оно есть у списка или у числа,
      но не у строки.
    fix: Проверь, что применяешь действие к подходящему значению.

  - type: ModuleNotFoundError
    title: Такой библиотеки нет
    body: |
      Python не нашёл указанный модуль. В нашем курсе внешние библиотеки
      не нужны — всё делается встроенными средствами.
    fix: Убери строку с `import`, она здесь не требуется.
