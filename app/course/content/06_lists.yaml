  - id: t06_final
    ord: 4
    title: Задания по всей теме
    concepts: [список, перебор, фильтр]
    theory_md: |
      ## Проверим, что закрепилось

      Списки и циклы теперь работают вместе. Главное из темы:

      - нумерация с нуля, последний элемент — `[-1]`;
      - `for товар in покупки` идёт по значениям, `range` не нужен;
      - отбор делают так: пустой список, цикл, условие, `append`;
      - `sorted` возвращает новый список, исходный не трогает.
    tasks:
      - id: t06_final_t1
        ord: 1
        is_final: true
        statement_md: |
          Дан список:

          ```
          числа = [14, 3, 27, 8, 41, 5, 19]
          ```

          Напечатай две строки: сколько в списке чисел больше 10
          и их сумму.

          ```
          Больше десяти: 4
          Их сумма: 101
          ```
        starter_code: |
          числа = [14, 3, 27, 8, 41, 5, 19]
        solution: |
          числа = [14, 3, 27, 8, 41, 5, 19]
          отобранные = []
          for число in числа:
              if число > 10:
                  отобранные.append(число)
          print(f"Больше десяти: {len(отобранные)}")
          print(f"Их сумма: {sum(отобранные)}")
        concepts: [список, фильтр, append]
        tests:
          - kind: ast
            require: [For, If]
          - kind: stdout
            expect: |
              Больше десяти: 4
              Их сумма: 101

      - id: t06_final_t2
        ord: 2
        is_final: true
        statement_md: |
          Дан список оценок:

          ```
          оценки = [4, 5, 3, 5, 4, 2, 5]
          ```

          Напечатай три строки:

          ```
          Всего оценок: 7
          Средний балл: 4.00
          Пятёрок: 3
          ```
        starter_code: |
          оценки = [4, 5, 3, 5, 4, 2, 5]
        solution: |
          оценки = [4, 5, 3, 5, 4, 2, 5]
          print(f"Всего оценок: {len(оценки)}")
          print(f"Средний балл: {sum(оценки) / len(оценки):.2f}")

          пятёрок = 0
          for оценка in оценки:
              if оценка == 5:
                  пятёрок += 1
          print(f"Пятёрок: {пятёрок}")
        concepts: [список, счётчик, f-строка]
        tests:
          - kind: ast
            require: [For, If]
          - kind: stdout
            expect: |
              Всего оценок: 7
              Средний балл: 4.00
              Пятёрок: 3

      - id: t06_final_t3
        ord: 3
        is_final: true
        statement_md: |
          Дан список слов:

          ```
          слова = ["кот", "бегемот", "пёс", "крокодил", "ёж"]
          ```

          Собери список слов длиннее трёх букв и напечатай его
          по алфавиту:

          ```
          ['бегемот', 'крокодил']
          ```
        starter_code: |
          слова = ["кот", "бегемот", "пёс", "крокодил", "ёж"]
        solution: |
          слова = ["кот", "бегемот", "пёс", "крокодил", "ёж"]
          длинные = []
          for слово in слова:
              if len(слово) > 3:
                  длинные.append(слово)
          print(sorted(длинные))
        concepts: [список, фильтр, sorted]
        tests:
          - kind: ast
            require: [For, If]
          - kind: stdout
            expect: "['бегемот', 'крокодил']"
