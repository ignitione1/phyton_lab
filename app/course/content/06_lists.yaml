topic:
  id: t06
  ord: 6
  title: Списки — много значений в одной коробке

lessons:
  # ======================================================================
  - id: t06_l01
    ord: 1
    title: Что такое список
    concepts: [список, индекс]
    theory_md: |
      ## Одна коробка на много вещей

      Переменная хранит одно значение. А если нужно хранить список покупок,
      оценки за четверть, имена участников?

      Заводить `товар1`, `товар2`, `товар3` — путь в никуда. Есть **список**:

      ```
      покупки = ["хлеб", "молоко", "сыр"]
      ```

      Квадратные скобки, значения через запятую. Теперь в одной переменной
      лежат все три.

      ## Обращение по номеру

      Каждому элементу соответствует номер — **индекс**:

      ```
      покупки = ["хлеб", "молоко", "сыр"]
      print(покупки[0])    → хлеб
      print(покупки[1])    → молоко
      print(покупки[2])    → сыр
      ```

      ## Нумерация с нуля

      Это второе место после `==`, где спотыкаются все.

      **Первый элемент имеет номер 0**, а не 1. У списка из трёх элементов
      номера 0, 1 и 2. Номера 3 не существует — попытка обратиться к нему
      даст ошибку `IndexError: list index out of range`.

      Странно, но так устроено большинство языков. Привыкается быстро.

      ## С конца

      Отрицательные номера считают с конца:

      ```
      print(покупки[-1])    → сыр       последний
      print(покупки[-2])    → молоко    предпоследний
      ```

      Удобно, когда не знаешь длину списка.

      ## Сколько элементов

      ```
      print(len(покупки))    → 3
      ```

      `len` — от английского *length*, «длина». Последний элемент всегда
      имеет номер `len(список) - 1`.

      ## Значение можно заменить

      ```
      покупки[1] = "кефир"
      print(покупки)    → ['хлеб', 'кефир', 'сыр']
      ```

      ## В списке может лежать что угодно

      ```
      оценки = [5, 4, 5, 3]
      смесь = ["Аня", 25, True]
      пустой = []
      ```

      Обычно в список кладут однородное — все оценки, все имена.
      Так проще потом с ним работать.
    examples:
      - caption: Список и обращение по номеру
        code: |
          покупки = ["хлеб", "молоко", "сыр"]
          print(покупки[0])
          print(покупки[1])
          print(покупки[2])
      - caption: С конца и длина
        code: |
          покупки = ["хлеб", "молоко", "сыр"]
          print(покупки[-1])
          print(len(покупки))
      - caption: Замена значения
        code: |
          покупки = ["хлеб", "молоко", "сыр"]
          покупки[1] = "кефир"
          print(покупки)
      - caption: Ошибка выхода за край — запусти и прочитай
        code: |
          покупки = ["хлеб", "молоко", "сыр"]
          print(покупки[3])
    tasks:
      - id: t06_l01_t1
        ord: 1
        statement_md: |
          Дан список:

          ```
          города = ["Москва", "Казань", "Сочи"]
          ```

          Напечатай **первый** город из списка.

          Должно получиться:

          ```
          Москва
          ```
        starter_code: |
          города = ["Москва", "Казань", "Сочи"]
        solution: |
          города = ["Москва", "Казань", "Сочи"]
          print(города[0])
        concepts: [список, индекс]
        tests:
          - kind: stdout
            expect: "Москва"
            hint: Помни, что нумерация начинается с нуля.

      - id: t06_l01_t2
        ord: 2
        statement_md: |
          Тот же список городов.

          Напечатай **последний** город и **сколько всего** городов
          в списке, каждое на своей строке:

          ```
          Сочи
          3
          ```

          Номер последнего вписывать вручную не надо — есть способ лучше.
        starter_code: |
          города = ["Москва", "Казань", "Сочи"]
        solution: |
          города = ["Москва", "Казань", "Сочи"]
          print(города[-1])
          print(len(города))
        concepts: [список, len]
        tests:
          - kind: stdout
            expect: |
              Сочи
              3
            hint: Последний элемент можно взять с конца, а длину даёт len().

      - id: t06_l01_t3
        ord: 3
        statement_md: |
          Дан список оценок:

          ```
          оценки = [5, 4, 3, 5]
          ```

          Замени третью оценку (ту, что равна 3) на 5 и напечатай
          весь список целиком.

          Должно получиться:

          ```
          [5, 4, 5, 5]
          ```
        starter_code: |
          оценки = [5, 4, 3, 5]
        solution: |
          оценки = [5, 4, 3, 5]
          оценки[2] = 5
          print(оценки)
        concepts: [список, индекс]
        tests:
          - kind: stdout
            expect: "[5, 4, 5, 5]"
            hint: Третий элемент имеет номер 2.

  # ======================================================================
  - id: t06_l02
    ord: 2
    title: Перебор и изменение списка
    concepts: [перебор, append]
    theory_md: |
      ## Цикл по списку

      Вот где списки и циклы встречаются:

      ```
      покупки = ["хлеб", "молоко", "сыр"]

      for товар in покупки:
          print(товар)
      ```

      Читается: «для каждого товара из покупок — напечатай его».

      Заметь: `range` не нужен. Цикл сам проходит по всем элементам
      по порядку, и на каждом повторе кладёт очередной в переменную.

      Имя переменной придумываешь сам. Хорошая привычка — называть
      в единственном числе то, что перебираешь: `for товар in покупки`,
      `for оценка in оценки`.

      ## Считаем по списку

      Знакомый накопитель, только источник теперь список:

      ```
      оценки = [5, 4, 3, 5]

      сумма = 0
      for оценка in оценки:
          сумма += оценка

      print("Сумма:", сумма)
      print("Средняя:", сумма / len(оценки))
      ```

      ## Готовые действия

      Для частых задач есть готовое:

      ```
      оценки = [5, 4, 3, 5]
      print(sum(оценки))    → 17    сумма
      print(max(оценки))    → 5     наибольшее
      print(min(оценки))    → 3     наименьшее
      print(len(оценки))    → 4     количество
      ```

      Писать цикл ради суммы не нужно — но важно понимать, как он работал бы.

      ## Добавить элемент

      ```
      покупки = ["хлеб"]
      покупки.append("молоко")
      print(покупки)    → ['хлеб', 'молоко']
      ```

      `append` — «добавить в конец». Точка перед словом означает
      «сделай с этим списком вот что».

      Очень частый приём — собирать список в цикле:

      ```
      квадраты = []
      for число in range(1, 6):
          квадраты.append(число * число)
      print(квадраты)    → [1, 4, 9, 16, 25]
      ```

      Начали с пустого списка, на каждом повторе дописали.

      ## Удалить элемент

      ```
      покупки.remove("хлеб")     убрать по значению
      ```

      ## Проверить наличие

      ```
      if "молоко" in покупки:
          print("Молоко есть")
      ```

      Слово `in` отвечает `True` или `False`.
    examples:
      - caption: Перебираем список
        code: |
          покупки = ["хлеб", "молоко", "сыр"]
          for товар in покупки:
              print(товар)
      - caption: Считаем среднее
        code: |
          оценки = [5, 4, 3, 5]
          сумма = 0
          for оценка in оценки:
              сумма += оценка
          print("Сумма:", сумма)
          print("Средняя:", сумма / len(оценки))
      - caption: Собираем список в цикле
        code: |
          квадраты = []
          for число in range(1, 6):
              квадраты.append(число * число)
          print(квадраты)
      - caption: Проверка наличия
        code: |
          покупки = ["хлеб", "молоко"]
          if "молоко" in покупки:
              print("Молоко есть")
          else:
              print("Молока нет")
    tasks:
      - id: t06_l02_t1
        ord: 1
        statement_md: |
          Дан список:

          ```
          animals = ["кот", "пёс", "хомяк"]
          ```

          Напечатай каждое животное на своей строке, используя цикл.

          ```
          кот
          пёс
          хомяк
          ```
        starter_code: |
          animals = ["кот", "пёс", "хомяк"]
        solution: |
          animals = ["кот", "пёс", "хомяк"]
          for животное in animals:
              print(животное)
        concepts: [перебор, for]
        tests:
          - kind: ast
            require: [For]
            hint: Нужен цикл, а не три отдельных print.
          - kind: stdout
            expect: |
              кот
              пёс
              хомяк

      - id: t06_l02_t2
        ord: 2
        statement_md: |
          Дан список оценок:

          ```
          оценки = [5, 3, 4, 5, 4]
          ```

          Напечатай средний балл с двумя знаками после точки:

          ```
          Средний балл: 4.20
          ```
        starter_code: |
          оценки = [5, 3, 4, 5, 4]
        solution: |
          оценки = [5, 3, 4, 5, 4]
          среднее = sum(оценки) / len(оценки)
          print(f"Средний балл: {среднее:.2f}")
        concepts: [список, среднее, f-строка]
        tests:
          - kind: stdout
            expect: "Средний балл: 4.20"
            hint: Сумму даёт sum(), количество — len().

      - id: t06_l02_t3
        ord: 3
        statement_md: |
          Собери в цикле список кубов чисел от 1 до 5 (число, умноженное
          само на себя трижды) и напечатай его:

          ```
          [1, 8, 27, 64, 125]
          ```

          Начни с пустого списка и добавляй в него значения.
        starter_code: |
          кубы = []
        solution: |
          кубы = []
          for число in range(1, 6):
              кубы.append(число ** 3)
          print(кубы)
        concepts: [append, for]
        tests:
          - kind: ast
            require: [For]
            hint: Список нужно собрать циклом, а не написать готовым.
          - kind: stdout
            expect: "[1, 8, 27, 64, 125]"

  # ======================================================================
  - id: t06_l03
    ord: 3
    title: Отбор и сортировка
    concepts: [фильтр, sorted, срез]
    theory_md: |
      ## Отобрать подходящее

      Очень частая задача: из списка выбрать только то, что подходит.
      Приём тот же — пустой список плюс цикл плюс условие:

      ```
      числа = [4, 7, 12, 3, 20, 9]

      большие = []
      for число in числа:
          if число > 5:
              большие.append(число)

      print(большие)    → [7, 12, 20, 9]
      ```

      Три уровня отступа: цикл, внутри условие, внутри действие.
      Отступы показывают, что чему подчинено.

      ## Сортировка

      ```
      числа = [4, 7, 12, 3]
      print(sorted(числа))    → [3, 4, 7, 12]
      ```

      `sorted` возвращает **новый** отсортированный список, а исходный
      не трогает.

      По убыванию:

      ```
      print(sorted(числа, reverse=True))    → [12, 7, 4, 3]
      ```

      Текст сортируется по алфавиту:

      ```
      имена = ["Пётр", "Аня", "Борис"]
      print(sorted(имена))    → ['Аня', 'Борис', 'Пётр']
      ```

      ## Кусок списка — срез

      Квадратные скобки с двоеточием дают часть списка:

      ```
      числа = [10, 20, 30, 40, 50]
      print(числа[1:4])    → [20, 30, 40]
      ```

      Читается: «с первого по четвёртый, не включая четвёртый». Правило
      то же, что у `range`: правая граница не входит.

      Можно опускать границы:

      ```
      print(числа[:3])     → [10, 20, 30]    первые три
      print(числа[2:])     → [30, 40, 50]    с третьего до конца
      print(числа[-2:])    → [40, 50]        последние два
      ```

      ## Три самых крупных

      Приёмы складываются:

      ```
      числа = [4, 7, 12, 3, 20, 9]
      print(sorted(числа, reverse=True)[:3])    → [20, 12, 9]
      ```

      Отсортировали по убыванию, взяли первые три.
    examples:
      - caption: Отбираем подходящие
        code: |
          числа = [4, 7, 12, 3, 20, 9]
          большие = []
          for число in числа:
              if число > 5:
                  большие.append(число)
          print(большие)
      - caption: Сортировка
        code: |
          числа = [4, 7, 12, 3]
          print(sorted(числа))
          print(sorted(числа, reverse=True))
          print(числа)
      - caption: Срезы
        code: |
          числа = [10, 20, 30, 40, 50]
          print(числа[1:4])
          print(числа[:3])
          print(числа[-2:])
    tasks:
      - id: t06_l03_t1
        ord: 1
        statement_md: |
          Дан список:

          ```
          числа = [12, 5, 8, 130, 44, 3]
          ```

          Отбери только те числа, которые больше 10, и напечатай
          получившийся список:

          ```
          [12, 130, 44]
          ```
        starter_code: |
          числа = [12, 5, 8, 130, 44, 3]
        solution: |
          числа = [12, 5, 8, 130, 44, 3]
          большие = []
          for число in числа:
              if число > 10:
                  большие.append(число)
          print(большие)
        concepts: [фильтр, for, if]
        tests:
          - kind: ast
            require: [For, If]
            hint: Понадобится цикл с условием внутри.
          - kind: stdout
            expect: "[12, 130, 44]"

      - id: t06_l03_t2
        ord: 2
        statement_md: |
          Дан список имён:

          ```
          имена = ["Пётр", "Аня", "Борис", "Вера"]
          ```

          Напечатай их по алфавиту:

          ```
          ['Аня', 'Борис', 'Вера', 'Пётр']
          ```
        starter_code: |
          имена = ["Пётр", "Аня", "Борис", "Вера"]
        solution: |
          имена = ["Пётр", "Аня", "Борис", "Вера"]
          print(sorted(имена))
        concepts: [sorted]
        tests:
          - kind: stdout
            expect: "['Аня', 'Борис', 'Вера', 'Пётр']"
            hint: Для упорядочивания есть готовое действие sorted().

      - id: t06_l03_t3
        ord: 3
        statement_md: |
          Дан список результатов:

          ```
          результаты = [45, 92, 67, 88, 71, 95, 53]
          ```

          Напечатай три самых больших значения по убыванию:

          ```
          [95, 92, 88]
          ```
        starter_code: |
          результаты = [45, 92, 67, 88, 71, 95, 53]
        solution: |
          результаты = [45, 92, 67, 88, 71, 95, 53]
          print(sorted(результаты, reverse=True)[:3])
        concepts: [sorted, срез]
        tests:
          - kind: stdout
            expect: "[95, 92, 88]"
            hint: Отсортируй по убыванию, потом возьми срез из первых трёх.
