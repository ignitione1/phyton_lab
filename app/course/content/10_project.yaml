topic:
  id: t10
  ord: 10
  title: Итоговый проект

lessons:
  # ======================================================================
  - id: t10_l01
    ord: 1
    title: Собираем всё вместе
    concepts: [проект, функция, словарь, список]
    theory_md: |
      ## Ты дошёл до конца

      Оглянись на то, что уже умеешь:

      - печатать и спрашивать — `print`, `input`;
      - хранить значения — переменные, списки, словари;
      - принимать решения — `if`, `elif`, `else`;
      - повторять — `for`, `while`;
      - выделять смысл в отдельные куски — функции;
      - не падать от ошибок — `try`, `except`;
      - сохранять результат — файлы.

      Этого достаточно, чтобы писать настоящие полезные программы.
      Дальше идёт не «ещё одна важная тема», а глубина и практика.

      ## Как подступаться к задаче целиком

      Главный приём — **не решать всё сразу**. Разбей на куски, каждый
      из которых понятен.

      Задача: «программа учёта расходов». Звучит внушительно. Разбираем:

      1. хранить расходы — список словарей;
      2. добавить расход — функция;
      3. посчитать сумму — функция;
      4. показать список — функция;
      5. спросить, что делать — цикл с `input`.

      Каждый пункт — пять-десять строк, и каждый можно проверить отдельно.
      Вот это и есть программирование: не героическое сочинение сложного,
      а спокойная сборка из простого.

      ## Список словарей — рабочая лошадка

      Сочетание, которым описывают почти любые данные:

      ```
      расходы = [
          {"название": "хлеб", "сумма": 45},
          {"название": "проезд", "сумма": 60},
      ]

      for расход in расходы:
          print(f"{расход['название']}: {расход['сумма']} руб.")
      ```

      Список — потому что записей много. Словарь — потому что у каждой
      записи есть поля с названиями.

      Обрати внимание на кавычки внутри f-строки: снаружи двойные,
      внутри одинарные. Иначе Python запутается, где конец строки.

      ## Дальше

      После этой темы стоит взять свою задачу — любую, лишь бы она была
      нужна лично тебе, — и написать. Своя задача учит быстрее любого курса.
    examples:
      - caption: Список словарей
        code: |
          расходы = [
              {"название": "хлеб", "сумма": 45},
              {"название": "проезд", "сумма": 60},
          ]

          for расход in расходы:
              print(f"{расход['название']}: {расход['сумма']} руб.")
      - caption: Считаем итог
        code: |
          расходы = [
              {"название": "хлеб", "сумма": 45},
              {"название": "проезд", "сумма": 60},
          ]

          итог = 0
          for расход in расходы:
              итог += расход["сумма"]

          print(f"Всего потрачено: {итог} руб.")
    tasks:
      - id: t10_l01_t1
        ord: 1
        statement_md: |
          Напиши функцию `общая_сумма`, которая принимает список расходов
          (каждый — словарь с ключами `название` и `сумма`) и возвращает
          общую сумму.

          Для списка из двух расходов по 45 и 60 должно вернуться `105`.
        starter_code: |
          def общая_сумма(расходы):
        solution: |
          def общая_сумма(расходы):
              итог = 0
              for расход in расходы:
                  итог += расход["сумма"]
              return итог
        concepts: [функция, список, словарь]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For]
          - kind: call
            func: общая_сумма
            args: [[{"название": "хлеб", "сумма": 45}, {"название": "проезд", "сумма": 60}]]
            expect_value: 105
          - kind: call
            func: общая_сумма
            args: [[]]
            expect_value: 0
          - kind: call
            func: общая_сумма
            args: [[{"название": "кофе", "сумма": 200}]]
            expect_value: 200

      - id: t10_l01_t2
        ord: 2
        statement_md: |
          Напиши функцию `самый_дорогой`, которая принимает такой же список
          расходов и возвращает **название** самого дорогого.

          Если список пуст — верни текст `нет данных`.
        starter_code: |
          def самый_дорогой(расходы):
        solution: |
          def самый_дорогой(расходы):
              if len(расходы) == 0:
                  return "нет данных"
              лучший = расходы[0]
              for расход in расходы:
                  if расход["сумма"] > лучший["сумма"]:
                      лучший = расход
              return лучший["название"]
        concepts: [функция, поиск максимума, словарь]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For, If]
          - kind: call
            func: самый_дорогой
            args: [[{"название": "хлеб", "сумма": 45}, {"название": "проезд", "сумма": 60}]]
            expect_value: "проезд"
          - kind: call
            func: самый_дорогой
            args: [[]]
            expect_value: "нет данных"
            hint: Не забудь про случай пустого списка.
          - kind: call
            func: самый_дорогой
            args: [[{"название": "кофе", "сумма": 200}]]
            expect_value: "кофе"

      - id: t10_l01_t3
        ord: 3
        statement_md: |
          Напиши функцию `дороже_чем`, которая принимает список расходов
          и число, а возвращает **список названий** тех расходов, что
          дороже указанной суммы.

          Порядок сохрани тот же, что в исходном списке.
        starter_code: |
        solution: |
          def дороже_чем(расходы, граница):
              результат = []
              for расход in расходы:
                  if расход["сумма"] > граница:
                      результат.append(расход["название"])
              return результат
        concepts: [функция, фильтр, словарь]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For, If]
          - kind: call
            func: дороже_чем
            args:
              - [{"название": "хлеб", "сумма": 45}, {"название": "проезд", "сумма": 60}, {"название": "кофе", "сумма": 200}]
              - 50
            expect_value: ["проезд", "кофе"]
          - kind: call
            func: дороже_чем
            args: [[{"название": "хлеб", "сумма": 45}], 100]
            expect_value: []

  # ======================================================================
  - id: t10_l02
    ord: 2
    title: Записная книжка
    concepts: [проект, словарь, файл]
    theory_md: |
      ## Последнее задание

      Соберём маленькую, но полную программу — телефонную книжку.
      Она умеет добавлять записи, искать и показывать всё.

      Мы разберём её по частям, а потом ты напишешь свои куски.

      ## Хранение

      Имя → телефон. Это в точности словарь:

      ```
      книжка = {"Аня": "+7 900 111-22-33", "Пётр": "+7 900 444-55-66"}
      ```

      ## Действия — по функции на каждое

      ```
      def добавить(книжка, имя, телефон):
          книжка[имя] = телефон

      def найти(книжка, имя):
          return книжка.get(имя, "не найдено")

      def показать(книжка):
          for имя, телефон in книжка.items():
              print(f"{имя}: {телефон}")
      ```

      Каждая функция делает ровно одно, и каждую можно проверить отдельно.
      Это не педантизм: когда что-то сломается, вы сразу будете знать,
      где смотреть.

      ## Главный цикл

      ```
      while True:
          команда = input("Команда (добавить/найти/показать/выход): ").strip()

          if команда == "выход":
              break
          elif команда == "добавить":
              имя = input("Имя: ")
              телефон = input("Телефон: ")
              добавить(книжка, имя, телефон)
          elif команда == "найти":
              имя = input("Имя: ")
              print(найти(книжка, имя))
          elif команда == "показать":
              показать(книжка)
          else:
              print("Не понял команду")
      ```

      Здесь сошлось всё: цикл, условия, функции, словарь, ввод.
      Ровно то, чему был посвящён курс.

      ## Что дальше

      Эту программу можно улучшать бесконечно: сохранять в файл, удалять
      записи, искать по части имени, проверять телефон на правильность.

      Вот этим и стоит заняться дальше — брать работающую программу
      и делать её лучше. Так учатся все.
    examples:
      - caption: Функции книжки
        code: |
          def добавить(книжка, имя, телефон):
              книжка[имя] = телефон

          def найти(книжка, имя):
              return книжка.get(имя, "не найдено")

          книжка = {}
          добавить(книжка, "Аня", "+7 900 111-22-33")
          print(найти(книжка, "Аня"))
          print(найти(книжка, "Никого"))
      - caption: Показываем всё
        code: |
          книжка = {"Аня": "+7 900 111", "Пётр": "+7 900 222"}
          for имя, телефон in книжка.items():
              print(f"{имя}: {телефон}")
    tasks:
      - id: t10_l02_t1
        ord: 1
        statement_md: |
          Напиши функцию `найти`, которая принимает словарь-книжку и имя,
          а возвращает телефон.

          Если такого имени нет — верни текст `не найдено`.
        starter_code: |
          def найти(книжка, имя):
        solution: |
          def найти(книжка, имя):
              return книжка.get(имя, "не найдено")
        concepts: [функция, словарь, get]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: найти
            args: [{"Аня": "111", "Пётр": "222"}, "Аня"]
            expect_value: "111"
          - kind: call
            func: найти
            args: [{"Аня": "111"}, "Никого"]
            expect_value: "не найдено"
          - kind: call
            func: найти
            args: [{}, "Кто угодно"]
            expect_value: "не найдено"

      - id: t10_l02_t2
        ord: 2
        statement_md: |
          Напиши функцию `поиск_по_началу`, которая принимает книжку
          и несколько первых букв имени, а возвращает **список имён**,
          начинающихся с этих букв.

          Например, для книжки с именами `Аня`, `Андрей`, `Пётр`
          и начала `Ан` вернётся `["Аня", "Андрей"]`.
        starter_code: |
          def поиск_по_началу(книжка, начало):
        solution: |
          def поиск_по_началу(книжка, начало):
              результат = []
              for имя in книжка:
                  if имя.startswith(начало):
                      результат.append(имя)
              return результат
        concepts: [функция, словарь, startswith]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For, If]
          - kind: call
            func: поиск_по_началу
            args: [{"Аня": "1", "Андрей": "2", "Пётр": "3"}, "Ан"]
            expect_value: ["Аня", "Андрей"]
          - kind: call
            func: поиск_по_началу
            args: [{"Аня": "1"}, "Я"]
            expect_value: []

      - id: t10_l02_t3
        ord: 3
        statement_md: |
          Завершающее задание курса.

          Напиши функцию `отчёт`, которая принимает книжку и возвращает
          текст в таком виде:

          ```
          Записей: 2
          Аня: 111
          Пётр: 222
          ```

          Первая строка — количество записей, дальше по строке на запись.
          Строки разделяются символом перехода `\n`.

          Если книжка пуста, вернуть надо ровно `Записей: 0`.
        starter_code: |
          def отчёт(книжка):
        solution: |
          def отчёт(книжка):
              строки = [f"Записей: {len(книжка)}"]
              for имя, телефон in книжка.items():
                  строки.append(f"{имя}: {телефон}")
              return "\n".join(строки)
        concepts: [функция, словарь, join, f-строка]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For]
          - kind: call
            func: отчёт
            args: [{"Аня": "111", "Пётр": "222"}]
            expect_value: "Записей: 2\nАня: 111\nПётр: 222"
            hint: Собери строки в список, потом склей их через join.
          - kind: call
            func: отчёт
            args: [{}]
            expect_value: "Записей: 0"
