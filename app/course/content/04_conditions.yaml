topic:
  id: t04
  ord: 4
  title: Условия — программа принимает решения

lessons:
  # ======================================================================
  - id: t04_l01
    ord: 1
    title: Правда и неправда
    concepts: [сравнение, bool]
    theory_md: |
      ## Программа умеет отвечать «да» или «нет»

      Пока наши программы шли строго сверху вниз. Настоящие программы
      умеют выбирать: если так — делаем одно, иначе — другое.

      Начнём с того, как программа вообще что-то решает. Она сравнивает:

      ```
      print(5 > 3)
      ```

      напечатает `True` — по-английски «истина», то есть «да, верно».

      ```
      print(5 < 3)
      ```

      напечатает `False` — «ложь», «нет, неверно».

      Эти два слова — особые значения Python. Пишутся с большой буквы
      и без кавычек: `True` и `False`. Это не текст, а ответ «да» или «нет».

      ## Знаки сравнения

      | Знак | Что значит | Пример | Ответ |
      |---|---|---|---|
      | `>` | больше | `7 > 3` | `True` |
      | `<` | меньше | `7 < 3` | `False` |
      | `>=` | больше или равно | `5 >= 5` | `True` |
      | `<=` | меньше или равно | `4 <= 3` | `False` |
      | `==` | равно | `5 == 5` | `True` |
      | `!=` | не равно | `5 != 3` | `True` |

      ## Два знака равенства — не опечатка

      Это место, где спотыкаются почти все.

      - **Один** знак `=` означает «положи в коробку»: `возраст = 25`
      - **Два** знака `==` означают вопрос «а равно ли?»: `возраст == 25`

      Первое — действие. Второе — вопрос, на который получишь `True`
      или `False`.

      Если написать `if возраст = 25`, Python не поймёт и остановится.

      ## Сравнивать можно и текст

      ```
      print("кот" == "кот")     → True
      print("кот" == "Кот")     → False
      ```

      Большая буква — уже другой текст. Python сравнивает знак в знак.

      ## Несколько условий сразу

      Слово `and` — «и», оба условия должны выполниться:

      ```
      возраст = 25
      print(возраст > 18 and возраст < 60)   → True
      ```

      Слово `or` — «или», достаточно одного:

      ```
      день = "суббота"
      print(день == "суббота" or день == "воскресенье")   → True
      ```

      Слово `not` переворачивает ответ: `not True` даёт `False`.
    examples:
      - caption: Сравнения выдают True или False
        code: |
          print(5 > 3)
          print(5 < 3)
          print(5 == 5)
          print(5 != 5)
      - caption: Сравнение текста
        code: |
          print("кот" == "кот")
          print("кот" == "Кот")
      - caption: Два условия сразу
        code: |
          возраст = 25
          print(возраст > 18 and возраст < 60)
          print(возраст < 10 or возраст > 20)
    tasks:
      - id: t04_l01_t1
        ord: 1
        statement_md: |
          Напечатай результат сравнения: больше ли 100, чем 99.

          Должно получиться:

          ```
          True
          ```

          Печатать слово `True` вручную нельзя — пусть сравнивает программа.
        starter_code: |
        solution: |
          print(100 > 99)
        concepts: [сравнение]
        tests:
          - kind: stdout
            expect: "True"
          - kind: ast
            require: [Compare]
            hint: Нужно именно сравнение, а не готовое слово True.

      - id: t04_l01_t2
        ord: 2
        statement_md: |
          Спроси число вопросом `Число: ` и напечатай, чётное ли оно —
          то есть делится ли на 2 без остатка.

          Для ввода **8** должно получиться:

          ```
          Число: True
          ```

          Для ввода **7**:

          ```
          Число: False
          ```

          Подсказка: остаток от деления на 2 равен нулю у чётных.
        starter_code: |
        solution: |
          число = int(input("Число: "))
          print(число % 2 == 0)
        concepts: [сравнение, остаток]
        tests:
          - kind: stdout
            stdin: "8"
            expect: "Число: True"
            hint: Сравни остаток с нулём знаком ==
          - kind: stdout
            stdin: "7"
            expect: "Число: False"

      - id: t04_l01_t3
        ord: 3
        statement_md: |
          Спроси возраст вопросом `Возраст: ` и напечатай, подходит ли
          человек под условие «от 18 до 65 включительно».

          Для ввода **30**:

          ```
          Возраст: True
          ```

          Для ввода **70**:

          ```
          Возраст: False
          ```
        starter_code: |
        solution: |
          возраст = int(input("Возраст: "))
          print(возраст >= 18 and возраст <= 65)
        concepts: [сравнение, and]
        tests:
          - kind: stdout
            stdin: "30"
            expect: "Возраст: True"
            hint: Понадобятся два сравнения и слово and между ними.
          - kind: stdout
            stdin: "70"
            expect: "Возраст: False"
          - kind: stdout
            stdin: "18"
            expect: "Возраст: True"
            hint: Не забудь «включительно» — граница тоже подходит.

  # ======================================================================
  - id: t04_l02
    ord: 2
    title: Если — то
    concepts: [if, else, отступ]
    theory_md: |
      ## Первое решение

      Теперь, когда программа умеет отвечать «да» или «нет», научим её
      выбирать, что делать:

      ```
      возраст = 20

      if возраст >= 18:
          print("Проходите")
      ```

      Читается прямо: «**если** возраст больше или равен 18, напечатай
      «Проходите»».

      ## Три обязательные детали

      Посмотри на запись внимательно — три вещи, без которых не работает:

      1. слово `if` и после него условие;
      2. **двоеточие** в конце строки;
      3. **отступ** у строк, которые выполняются при выполнении условия.

      ## Про отступ — это важно

      Отступ — это четыре пробела в начале строки. В редакторе они ставятся
      клавишей Tab.

      Отступ для Python — не украшение, а смысл. Он показывает, **что
      находится внутри условия**:

      ```
      if возраст >= 18:
          print("Проходите")      ← с отступом, внутри условия
      print("Всего доброго")      ← без отступа, выполнится всегда
      ```

      Первая строка напечатается только совершеннолетним. Вторая — всем.

      В большинстве языков для этого используют скобки. В Python — отступы,
      и это одна из причин, почему его код легко читать.

      ## Иначе

      Слово `else` — «иначе». То, что делать, когда условие не выполнилось:

      ```
      возраст = 15

      if возраст >= 18:
          print("Проходите")
      else:
          print("Ещё рано")
      ```

      У `else` тоже двоеточие, и тоже отступ у того, что внутри.
      Условие у `else` не пишут — он срабатывает во всех остальных случаях.

      ## Внутри может быть несколько строк

      ```
      if возраст >= 18:
          print("Проходите")
          print("Приятного вечера")
      ```

      Обе строки с отступом — обе внутри условия.
    examples:
      - caption: Простое условие
        code: |
          возраст = 20
          if возраст >= 18:
              print("Проходите")
          print("Всего доброго")
      - caption: С «иначе»
        code: |
          возраст = 15
          if возраст >= 18:
              print("Проходите")
          else:
              print("Ещё рано")
      - caption: Спрашиваем у человека
        stdin: "25"
        code: |
          возраст = int(input("Сколько тебе лет? "))
          if возраст >= 18:
              print("Совершеннолетний")
          else:
              print("Несовершеннолетний")
    tasks:
      - id: t04_l02_t1
        ord: 1
        statement_md: |
          Спроси число вопросом `Число: `.

          Если оно больше 100 — напечатай `Большое`.
          Если нет — напечатай `Маленькое`.

          Для ввода **150**:

          ```
          Число: Большое
          ```

          Для ввода **5**:

          ```
          Число: Маленькое
          ```
        starter_code: |
          число = int(input("Число: "))
        solution: |
          число = int(input("Число: "))
          if число > 100:
              print("Большое")
          else:
              print("Маленькое")
        concepts: [if, else]
        tests:
          - kind: stdout
            stdin: "150"
            expect: "Число: Большое"
          - kind: stdout
            stdin: "5"
            expect: "Число: Маленькое"
          - kind: ast
            require: [If]
            hint: Здесь нужно условие if.

      - id: t04_l02_t2
        ord: 2
        statement_md: |
          Спроси пароль вопросом `Пароль: `.

          Если ввели ровно `котик` — напечатай `Добро пожаловать`.
          Иначе — `Неверный пароль`.

          Помни: сравнение текста делается двумя знаками равенства,
          и большие буквы важны.
        starter_code: |
        solution: |
          пароль = input("Пароль: ")
          if пароль == "котик":
              print("Добро пожаловать")
          else:
              print("Неверный пароль")
        concepts: [if, else, сравнение]
        tests:
          - kind: stdout
            stdin: "котик"
            expect: "Пароль: Добро пожаловать"
          - kind: stdout
            stdin: "собачка"
            expect: "Пароль: Неверный пароль"
          - kind: stdout
            stdin: "Котик"
            expect: "Пароль: Неверный пароль"
            hint: Большая буква — уже другой текст, так и должно быть.

      - id: t04_l02_t3
        ord: 3
        statement_md: |
          Спроси число вопросом `Число: ` и напечатай словами, чётное
          оно или нет:

          Для **8**:

          ```
          Число: Чётное
          ```

          Для **7**:

          ```
          Число: Нечётное
          ```
        starter_code: |
        solution: |
          число = int(input("Число: "))
          if число % 2 == 0:
              print("Чётное")
          else:
              print("Нечётное")
        concepts: [if, остаток]
        tests:
          - kind: stdout
            stdin: "8"
            expect: "Число: Чётное"
          - kind: stdout
            stdin: "7"
            expect: "Число: Нечётное"
          - kind: stdout
            stdin: "0"
            expect: "Число: Чётное"

  # ======================================================================
  - id: t04_l03
    ord: 3
    title: Несколько вариантов подряд
    concepts: [elif]
    theory_md: |
      ## Когда вариантов больше двух

      `if` и `else` дают выбор из двух. А если нужно три, пять, десять?

      Для этого есть `elif` — сокращение от «else if», то есть
      «а иначе, если».

      ```
      оценка = 4

      if оценка == 5:
          print("Отлично")
      elif оценка == 4:
          print("Хорошо")
      elif оценка == 3:
          print("Удовлетворительно")
      else:
          print("Неудовлетворительно")
      ```

      ## Как это работает

      Python проверяет условия **сверху вниз** и останавливается на первом
      подошедшем. Остальные даже не смотрит.

      Это важно. Вот пример, где порядок всё портит:

      ```
      рост = 150

      if рост > 100:
          print("Больше метра")
      elif рост > 140:
          print("Больше 140")
      ```

      Напечатается только `Больше метра`. До второго условия дело не дойдёт,
      хотя оно тоже верное. **Более частные условия ставят выше.**

      ## Сколько угодно elif

      Веток `elif` может быть сколько нужно. `else` в конце необязателен,
      но с ним надёжнее: он ловит все случаи, которые вы не предусмотрели.

      ## Условие внутри условия

      Условия можно вкладывать друг в друга, добавляя отступ:

      ```
      возраст = 25
      билет = "есть"

      if возраст >= 18:
          if билет == "есть":
              print("Проходите")
          else:
              print("Нужен билет")
      else:
          print("Только с 18 лет")
      ```

      Чем глубже вложенность, тем труднее читать. Больше двух уровней —
      повод подумать, нельзя ли проще.
    examples:
      - caption: Оценки
        code: |
          оценка = 4
          if оценка == 5:
              print("Отлично")
          elif оценка == 4:
              print("Хорошо")
          elif оценка == 3:
              print("Удовлетворительно")
          else:
              print("Неудовлетворительно")
      - caption: Порядок условий важен — запусти и подумай почему
        code: |
          рост = 150
          if рост > 100:
              print("Больше метра")
          elif рост > 140:
              print("Больше 140")
      - caption: Условие внутри условия
        code: |
          возраст = 25
          билет = "есть"
          if возраст >= 18:
              if билет == "есть":
                  print("Проходите")
              else:
                  print("Нужен билет")
          else:
              print("Только с 18 лет")
    tasks:
      - id: t04_l03_t1
        ord: 1
        statement_md: |
          Спроси оценку вопросом `Оценка: ` и напечатай её словами:

          - 5 → `Отлично`
          - 4 → `Хорошо`
          - 3 → `Удовлетворительно`
          - всё остальное → `Плохо`
        starter_code: |
          оценка = int(input("Оценка: "))
        solution: |
          оценка = int(input("Оценка: "))
          if оценка == 5:
              print("Отлично")
          elif оценка == 4:
              print("Хорошо")
          elif оценка == 3:
              print("Удовлетворительно")
          else:
              print("Плохо")
        concepts: [elif]
        tests:
          - kind: stdout
            stdin: "5"
            expect: "Оценка: Отлично"
          - kind: stdout
            stdin: "4"
            expect: "Оценка: Хорошо"
          - kind: stdout
            stdin: "3"
            expect: "Оценка: Удовлетворительно"
          - kind: stdout
            stdin: "2"
            expect: "Оценка: Плохо"

      - id: t04_l03_t2
        ord: 2
        statement_md: |
          Спроси число вопросом `Число: ` и напечатай:

          - `Положительное`, если больше нуля
          - `Отрицательное`, если меньше нуля
          - `Ноль`, если равно нулю
        starter_code: |
        solution: |
          число = int(input("Число: "))
          if число > 0:
              print("Положительное")
          elif число < 0:
              print("Отрицательное")
          else:
              print("Ноль")
        concepts: [elif, сравнение]
        tests:
          - kind: stdout
            stdin: "7"
            expect: "Число: Положительное"
          - kind: stdout
            stdin: "-3"
            expect: "Число: Отрицательное"
          - kind: stdout
            stdin: "0"
            expect: "Число: Ноль"
            hint: Ноль не больше и не меньше нуля — для него подойдёт else.

      - id: t04_l03_t3
        ord: 3
        statement_md: |
          Магазин даёт скидку в зависимости от суммы покупки.

          Спроси сумму вопросом `Сумма: ` и напечатай размер скидки:

          - от 5000 и больше → `Скидка 20%`
          - от 1000 до 4999 → `Скидка 10%`
          - меньше 1000 → `Скидки нет`

          Подумай, в каком порядке ставить условия.
        starter_code: |
        solution: |
          сумма = int(input("Сумма: "))
          if сумма >= 5000:
              print("Скидка 20%")
          elif сумма >= 1000:
              print("Скидка 10%")
          else:
              print("Скидки нет")
        concepts: [elif, порядок условий]
        tests:
          - kind: stdout
            stdin: "6000"
            expect: "Сумма: Скидка 20%"
            hint: Самое строгое условие должно стоять первым.
          - kind: stdout
            stdin: "2000"
            expect: "Сумма: Скидка 10%"
          - kind: stdout
            stdin: "500"
            expect: "Сумма: Скидки нет"
          - kind: stdout
            stdin: "5000"
            expect: "Сумма: Скидка 20%"
            hint: Граница 5000 включается в большую скидку.
  # ======================================================================
  - id: t04_final
    ord: 4
    title: Задания по всей теме
    concepts: [if, elif, сравнение]
    theory_md: |
      ## Проверим, что закрепилось

      Программа научилась выбирать. Напомню главное:

      - `==` спрашивает «равно ли», а `=` кладёт в переменную;
      - отступ показывает, что находится внутри условия;
      - `elif` проверяется по порядку, сверху вниз, и останавливается
        на первом подошедшем — значит, более строгие условия ставят выше.
    tasks:
      - id: t04_final_t1
        ord: 1
        is_final: true
        statement_md: |
          Спроси температуру воздуха (`Температура: `) и напечатай совет:

          - меньше 0 → `Надень шапку`
          - от 0 до 15 → `Возьми куртку`
          - больше 15 → `Можно налегке`
        starter_code: |
        solution: |
          t = int(input("Температура: "))
          if t < 0:
              print("Надень шапку")
          elif t <= 15:
              print("Возьми куртку")
          else:
              print("Можно налегке")
        concepts: [if, elif]
        tests:
          - kind: stdout
            stdin: "-5"
            expect: "Температура: Надень шапку"
          - kind: stdout
            stdin: "10"
            expect: "Температура: Возьми куртку"
          - kind: stdout
            stdin: "25"
            expect: "Температура: Можно налегке"
          - kind: stdout
            stdin: "0"
            expect: "Температура: Возьми куртку"
            hint: Ноль попадает во вторую группу — проверь границы.

      - id: t04_final_t2
        ord: 2
        is_final: true
        statement_md: |
          Спроси число (`Число: `) и напечатай про него две вещи
          на одной строке:

          - положительное, отрицательное или ноль;
          - чётное оно или нечётное.

          Для **8**:

          ```
          Число: Положительное, чётное
          ```

          Для **-3**:

          ```
          Число: Отрицательное, нечётное
          ```
        starter_code: |
        solution: |
          n = int(input("Число: "))

          if n > 0:
              знак = "Положительное"
          elif n < 0:
              знак = "Отрицательное"
          else:
              знак = "Ноль"

          if n % 2 == 0:
              чётность = "чётное"
          else:
              чётность = "нечётное"

          print(f"{знак}, {чётность}")
        concepts: [if, elif, остаток]
        tests:
          - kind: stdout
            stdin: "8"
            expect: "Число: Положительное, чётное"
          - kind: stdout
            stdin: "-3"
            expect: "Число: Отрицательное, нечётное"
          - kind: stdout
            stdin: "0"
            expect: "Число: Ноль, чётное"
            hint: Ноль считается чётным.

      - id: t04_final_t3
        ord: 3
        is_final: true
        statement_md: |
          Вход на аттракцион: рост не меньше 120 см **и** возраст
          не меньше 6 лет.

          Спроси рост (`Рост: `) и возраст (`Возраст: `), напечатай
          `Проходите` или `Нельзя`.
        starter_code: |
        solution: |
          рост = int(input("Рост: "))
          возраст = int(input("Возраст: "))
          if рост >= 120 and возраст >= 6:
              print("Проходите")
          else:
              print("Нельзя")
        concepts: [if, and, сравнение]
        tests:
          - kind: stdout
            stdin: |
              130
              8
            expect: "Рост: Возраст: Проходите"
          - kind: stdout
            stdin: |
              110
              8
            expect: "Рост: Возраст: Нельзя"
