topic:
  id: t11
  ord: 11
  title: Экзамен — четыре своих проекта

lessons:
  # ======================================================================
  - id: t11_p1
    ord: 1
    title: Проект 1. Дневник оценок
    concepts: [список, функция, среднее, условие]
    theory_md: |
      ## Как устроен экзамен

      Впереди четыре небольших, но законченных проекта. Каждый — рабочая
      программа, а не упражнение. В них нет новых тем: всё, что нужно,
      ты уже проходил. Задача в другом — **собрать известное вместе**.

      Так выглядит настоящее программирование. Новое в нём появляется
      редко, а вот сочетать давно знакомое приходится постоянно.

      Подсказки работают как обычно. Если застрял — это нормально,
      на проектах застревают все.

      ## Проект 1: дневник оценок

      Программа, которая считает успеваемость по списку оценок:
      средний балл, лучшую и худшую оценку, и говорит словами, как дела.

      Разобьём на три части, по заданию на каждую:

      1. посчитать средний балл;
      2. описать результат словами;
      3. собрать полный отчёт.

      ## Напоминание по теме

      - `sum(список) / len(список)` — среднее;
      - `max` и `min` — наибольшее и наименьшее;
      - `{значение:.2f}` — два знака после точки;
      - пустой список — отдельный случай, про который легко забыть.
    tasks:
      - id: t11_p1_t1
        ord: 1
        is_final: true
        statement_md: |
          Напиши функцию `средний_балл`, которая принимает список оценок
          и возвращает средний балл, округлённый до двух знаков.

          Для `[5, 4, 3]` должно вернуться `4.0`.
          Для `[5, 4, 4]` — `4.33`.

          Если список пуст — верни `0`.

          Подсказка: округлить до двух знаков умеет `round(число, 2)`.
        starter_code: |
          def средний_балл(оценки):
        solution: |
          def средний_балл(оценки):
              if len(оценки) == 0:
                  return 0
              return round(sum(оценки) / len(оценки), 2)
        concepts: [функция, список, среднее]
        tests:
          - kind: ast
            require: [FunctionDef, Return, If]
            hint: Не забудь про пустой список — на нём деление не сработает.
          - kind: call
            func: средний_балл
            args: [[5, 4, 3]]
            expect_value: 4.0
          - kind: call
            func: средний_балл
            args: [[5, 4, 4]]
            expect_value: 4.33
          - kind: call
            func: средний_балл
            args: [[]]
            expect_value: 0
          - kind: call
            func: средний_балл
            args: [[3]]
            expect_value: 3.0

      - id: t11_p1_t2
        ord: 2
        is_final: true
        statement_md: |
          Напиши функцию `словами`, которая принимает средний балл
          и возвращает описание:

          - 4.5 и выше → `отличник`
          - от 3.5 до 4.49 → `хорошист`
          - от 2.5 до 3.49 → `троечник`
          - ниже 2.5 → `нужно подтянуться`

          Подумай над порядком условий.
        starter_code: |
          def словами(балл):
        solution: |
          def словами(балл):
              if балл >= 4.5:
                  return "отличник"
              elif балл >= 3.5:
                  return "хорошист"
              elif балл >= 2.5:
                  return "троечник"
              return "нужно подтянуться"
        concepts: [функция, elif, сравнение]
        tests:
          - kind: ast
            require: [FunctionDef, Return, If]
          - kind: call
            func: словами
            args: [4.8]
            expect_value: "отличник"
          - kind: call
            func: словами
            args: [4.0]
            expect_value: "хорошист"
          - kind: call
            func: словами
            args: [3.0]
            expect_value: "троечник"
          - kind: call
            func: словами
            args: [2.0]
            expect_value: "нужно подтянуться"
          - kind: call
            func: словами
            args: [4.5]
            expect_value: "отличник"
            hint: Граница 4.5 относится к отличникам.

      - id: t11_p1_t3
        ord: 3
        is_final: true
        statement_md: |
          Собери проект вместе.

          Напиши функцию `отчёт`, которая принимает список оценок
          и возвращает готовый текст из четырёх строк:

          ```
          Оценок: 3
          Средний балл: 4.33
          Лучшая: 5, худшая: 4
          Вывод: хорошист
          ```

          (для списка `[5, 4, 4]`)

          Строки разделяются символом `\n`. Можешь пользоваться функциями
          из прошлых заданий — просто напиши их в том же файле.

          Для пустого списка верни ровно `Оценок нет`.
        starter_code: |
          def отчёт(оценки):
        solution: |
          def средний_балл(оценки):
              if len(оценки) == 0:
                  return 0
              return round(sum(оценки) / len(оценки), 2)


          def словами(балл):
              if балл >= 4.5:
                  return "отличник"
              elif балл >= 3.5:
                  return "хорошист"
              elif балл >= 2.5:
                  return "троечник"
              return "нужно подтянуться"


          def отчёт(оценки):
              if len(оценки) == 0:
                  return "Оценок нет"

              балл = средний_балл(оценки)
              строки = [
                  f"Оценок: {len(оценки)}",
                  f"Средний балл: {балл}",
                  f"Лучшая: {max(оценки)}, худшая: {min(оценки)}",
                  f"Вывод: {словами(балл)}",
              ]
              return "\n".join(строки)
        concepts: [функция, f-строка, join, список]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: отчёт
            args: [[5, 4, 4]]
            expect_value: "Оценок: 3\nСредний балл: 4.33\nЛучшая: 5, худшая: 4\nВывод: хорошист"
          - kind: call
            func: отчёт
            args: [[]]
            expect_value: "Оценок нет"
          - kind: call
            func: отчёт
            args: [[5, 5]]
            expect_value: "Оценок: 2\nСредний балл: 5.0\nЛучшая: 5, худшая: 5\nВывод: отличник"

  # ======================================================================
  - id: t11_p2
    ord: 2
    title: Проект 2. Учёт расходов
    concepts: [словарь, список, сортировка, фильтр]
    theory_md: |
      ## Проект 2: куда уходят деньги

      Программа принимает список трат и отвечает на вопросы: сколько всего,
      на что больше всего, что дороже заданной суммы.

      Расход описывается словарём:

      ```
      {"категория": "еда", "сумма": 450}
      ```

      А все расходы — списком таких словарей. Это то самое сочетание,
      которым описывают почти любые данные.

      ## План

      1. посчитать, сколько ушло по каждой категории;
      2. найти категорию с наибольшей тратой;
      3. собрать отчёт со строками по убыванию суммы.

      ## Напоминание по теме

      - `for расход in расходы` — перебор списка;
      - `расход["сумма"]` — значение по ключу;
      - приём подсчёта: если ключ есть — прибавить, если нет — завести;
      - `sorted(..., reverse=True)` — по убыванию.
    tasks:
      - id: t11_p2_t1
        ord: 1
        is_final: true
        statement_md: |
          Напиши функцию `по_категориям`, которая принимает список
          расходов и возвращает **словарь**: категория → потраченная сумма.

          Для

          ```
          [{"категория": "еда", "сумма": 450},
           {"категория": "транспорт", "сумма": 60},
           {"категория": "еда", "сумма": 200}]
          ```

          должно вернуться `{"еда": 650, "транспорт": 60}`.
        starter_code: |
          def по_категориям(расходы):
        solution: |
          def по_категориям(расходы):
              итог = {}
              for расход in расходы:
                  категория = расход["категория"]
                  if категория in итог:
                      итог[категория] += расход["сумма"]
                  else:
                      итог[категория] = расход["сумма"]
              return итог
        concepts: [словарь, подсчёт, список]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For, If]
          - kind: call
            func: по_категориям
            args:
              - [{"категория": "еда", "сумма": 450}, {"категория": "транспорт", "сумма": 60}, {"категория": "еда", "сумма": 200}]
            expect_value: {"еда": 650, "транспорт": 60}
          - kind: call
            func: по_категориям
            args: [[]]
            expect_value: {}
          - kind: call
            func: по_категориям
            args: [[{"категория": "кофе", "сумма": 200}]]
            expect_value: {"кофе": 200}

      - id: t11_p2_t2
        ord: 2
        is_final: true
        statement_md: |
          Напиши функцию `самая_дорогая`, которая принимает список расходов
          и возвращает название категории, на которую ушло больше всего.

          Для примера из прошлого задания это `"еда"`.

          Если список пуст — верни `нет данных`.

          Можешь воспользоваться функцией из прошлого задания.
        starter_code: |
          def самая_дорогая(расходы):
        solution: |
          def по_категориям(расходы):
              итог = {}
              for расход in расходы:
                  категория = расход["категория"]
                  if категория in итог:
                      итог[категория] += расход["сумма"]
                  else:
                      итог[категория] = расход["сумма"]
              return итог


          def самая_дорогая(расходы):
              суммы = по_категориям(расходы)
              if len(суммы) == 0:
                  return "нет данных"

              лучшая = ""
              больше_всего = -1
              for категория, сумма in суммы.items():
                  if сумма > больше_всего:
                      больше_всего = сумма
                      лучшая = категория
              return лучшая
        concepts: [словарь, поиск максимума]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For]
          - kind: call
            func: самая_дорогая
            args:
              - [{"категория": "еда", "сумма": 450}, {"категория": "транспорт", "сумма": 60}, {"категория": "еда", "сумма": 200}]
            expect_value: "еда"
          - kind: call
            func: самая_дорогая
            args: [[]]
            expect_value: "нет данных"
          - kind: call
            func: самая_дорогая
            args: [[{"категория": "кино", "сумма": 300}, {"категория": "еда", "сумма": 100}]]
            expect_value: "кино"

      - id: t11_p2_t3
        ord: 3
        is_final: true
        statement_md: |
          Собери проект.

          Напиши функцию `отчёт_расходов`, которая принимает список
          расходов и возвращает текст:

          ```
          Всего потрачено: 710
          еда: 650
          транспорт: 60
          ```

          Первая строка — общая сумма. Дальше категории **по убыванию**
          суммы, по строке на каждую.

          Для пустого списка верни `Расходов нет`.
        starter_code: |
          def отчёт_расходов(расходы):
        solution: |
          def по_категориям(расходы):
              итог = {}
              for расход in расходы:
                  категория = расход["категория"]
                  if категория in итог:
                      итог[категория] += расход["сумма"]
                  else:
                      итог[категория] = расход["сумма"]
              return итог


          def отчёт_расходов(расходы):
              if len(расходы) == 0:
                  return "Расходов нет"

              суммы = по_категориям(расходы)
              всего = 0
              for сумма in суммы.values():
                  всего += сумма

              строки = [f"Всего потрачено: {всего}"]
              пары = sorted(суммы.items(), key=lambda пара: пара[1], reverse=True)
              for категория, сумма in пары:
                  строки.append(f"{категория}: {сумма}")

              return "\n".join(строки)
        concepts: [словарь, сортировка, join]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For]
          - kind: call
            func: отчёт_расходов
            args:
              - [{"категория": "еда", "сумма": 450}, {"категория": "транспорт", "сумма": 60}, {"категория": "еда", "сумма": 200}]
            expect_value: "Всего потрачено: 710\nеда: 650\nтранспорт: 60"
            hint: Категории нужно расставить по убыванию суммы.
          - kind: call
            func: отчёт_расходов
            args: [[]]
            expect_value: "Расходов нет"

  # ======================================================================
  - id: t11_p3
    ord: 3
    title: Проект 3. Разбор текста
    concepts: [строка, словарь, подсчёт]
    theory_md: |
      ## Проект 3: что написано в тексте

      Программа принимает текст и отвечает: сколько слов, какое слово
      самое длинное, какие слова встречаются чаще других.

      Такие разборы пишут постоянно — от подсчёта статистики до поиска
      по документам.

      ## План

      1. разбить текст на слова, приведя их к единому виду;
      2. посчитать, сколько раз встречается каждое слово;
      3. собрать отчёт.

      ## Важная тонкость

      Слова `Кот`, `кот` и `кот,` для Python — три разных слова. Прежде
      чем считать, текст приводят к единому виду: маленькие буквы,
      без знаков препинания.

      ## Напоминание по теме

      - `текст.lower()` — маленькие буквы;
      - `текст.split()` — разбить по пробелам;
      - `текст.replace(",", "")` — убрать знак;
      - приём подсчёта через словарь.
    tasks:
      - id: t11_p3_t1
        ord: 1
        is_final: true
        statement_md: |
          Напиши функцию `слова`, которая принимает текст и возвращает
          список слов: маленькими буквами, без точек и запятых.

          Для `"Кот сел. Кот, встал!"` должно вернуться
          `["кот", "сел", "кот", "встал"]`.

          Убирать нужно три знака: точку, запятую и восклицательный знак.
        starter_code: |
          def слова(текст):
        solution: |
          def слова(текст):
              чистый = текст.lower()
              чистый = чистый.replace(".", "")
              чистый = чистый.replace(",", "")
              чистый = чистый.replace("!", "")
              return чистый.split()
        concepts: [строка, split, replace]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: слова
            args: ["Кот сел. Кот, встал!"]
            expect_value: ["кот", "сел", "кот", "встал"]
          - kind: call
            func: слова
            args: ["ПРИВЕТ"]
            expect_value: ["привет"]
          - kind: call
            func: слова
            args: [""]
            expect_value: []

      - id: t11_p3_t2
        ord: 2
        is_final: true
        statement_md: |
          Напиши функцию `сколько_раз`, которая принимает список слов
          и возвращает словарь: слово → сколько раз встретилось.

          Для `["кот", "сел", "кот"]` должно вернуться
          `{"кот": 2, "сел": 1}`.
        starter_code: |
          def сколько_раз(список_слов):
        solution: |
          def сколько_раз(список_слов):
              счёт = {}
              for слово in список_слов:
                  if слово in счёт:
                      счёт[слово] += 1
                  else:
                      счёт[слово] = 1
              return счёт
        concepts: [словарь, подсчёт]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For, If]
          - kind: call
            func: сколько_раз
            args: [["кот", "сел", "кот"]]
            expect_value: {"кот": 2, "сел": 1}
          - kind: call
            func: сколько_раз
            args: [[]]
            expect_value: {}

      - id: t11_p3_t3
        ord: 3
        is_final: true
        statement_md: |
          Собери проект.

          Напиши функцию `разбор`, которая принимает текст и возвращает:

          ```
          Слов: 4
          Разных слов: 3
          Самое длинное: встал
          Чаще всего: кот (2)
          ```

          (для текста `"Кот сел. Кот, встал!"`)

          Если текст пустой — верни `Текст пустой`.

          Если самых длинных слов несколько, бери первое из них.
        starter_code: |
          def разбор(текст):
        solution: |
          def слова(текст):
              чистый = текст.lower()
              чистый = чистый.replace(".", "")
              чистый = чистый.replace(",", "")
              чистый = чистый.replace("!", "")
              return чистый.split()


          def сколько_раз(список_слов):
              счёт = {}
              for слово in список_слов:
                  if слово in счёт:
                      счёт[слово] += 1
                  else:
                      счёт[слово] = 1
              return счёт


          def разбор(текст):
              список = слова(текст)
              if len(список) == 0:
                  return "Текст пустой"

              счёт = сколько_раз(список)

              длинное = список[0]
              for слово in список:
                  if len(слово) > len(длинное):
                      длинное = слово

              частое = список[0]
              for слово, сколько in счёт.items():
                  if сколько > счёт[частое]:
                      частое = слово

              строки = [
                  f"Слов: {len(список)}",
                  f"Разных слов: {len(счёт)}",
                  f"Самое длинное: {длинное}",
                  f"Чаще всего: {частое} ({счёт[частое]})",
              ]
              return "\n".join(строки)
        concepts: [строка, словарь, функция, f-строка]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For]
          - kind: call
            func: разбор
            args: ["Кот сел. Кот, встал!"]
            expect_value: "Слов: 4\nРазных слов: 3\nСамое длинное: встал\nЧаще всего: кот (2)"
          - kind: call
            func: разбор
            args: [""]
            expect_value: "Текст пустой"

  # ======================================================================
  - id: t11_p4
    ord: 4
    title: Проект 4. Список дел
    concepts: [файл, словарь, try, функция]
    theory_md: |
      ## Проект 4: дела, которые не теряются

      Последний проект курса. Программа хранит список дел в файле,
      поэтому они остаются после закрытия.

      Дело описывается словарём:

      ```
      {"текст": "купить хлеб", "сделано": False}
      ```

      ## План

      1. сохранить дела в файл;
      2. прочитать обратно, не падая, если файла ещё нет;
      3. собрать отчёт о том, что сделано, а что нет.

      ## Как хранить в файле

      Файл хранит текст, а у нас словари. Значит, нужен формат строки.
      Договоримся так:

      ```
      купить хлеб|нет
      позвонить маме|да
      ```

      Текст дела, палочка, потом `да` или `нет`. При чтении строку
      разбираем обратно через `split("|")`.

      Это простейший способ; в настоящих программах для этого берут
      готовый формат вроде JSON, но принцип тот же.

      ## Напоминание по теме

      - `"w"` стирает файл, `"a"` дописывает, `"r"` читает;
      - `encoding="utf-8"` обязателен;
      - `strip()` убирает перенос строки после чтения;
      - `try/except FileNotFoundError` — на случай отсутствия файла.
    tasks:
      - id: t11_p4_t1
        ord: 1
        is_final: true
        statement_md: |
          Напиши функцию `в_строку`, которая принимает дело-словарь
          и возвращает строку для файла.

          Для `{"текст": "купить хлеб", "сделано": False}` должно
          вернуться `"купить хлеб|нет"`.

          Для `{"текст": "позвонить", "сделано": True}` —
          `"позвонить|да"`.
        starter_code: |
          def в_строку(дело):
        solution: |
          def в_строку(дело):
              if дело["сделано"]:
                  отметка = "да"
              else:
                  отметка = "нет"
              return f"{дело['текст']}|{отметка}"
        concepts: [словарь, f-строка, if]
        tests:
          - kind: ast
            require: [FunctionDef, Return, If]
          - kind: call
            func: в_строку
            args: [{"текст": "купить хлеб", "сделано": false}]
            expect_value: "купить хлеб|нет"
          - kind: call
            func: в_строку
            args: [{"текст": "позвонить", "сделано": true}]
            expect_value: "позвонить|да"

      - id: t11_p4_t2
        ord: 2
        is_final: true
        statement_md: |
          Напиши обратную функцию `из_строки`: принимает строку вида
          `"купить хлеб|нет"` и возвращает словарь

          ```
          {"текст": "купить хлеб", "сделано": False}
          ```

          Учти лишние пробелы и перенос строки по краям — их нужно убрать.
        starter_code: |
          def из_строки(строка):
        solution: |
          def из_строки(строка):
              части = строка.strip().split("|")
              return {"текст": части[0], "сделано": части[1] == "да"}
        concepts: [строка, split, словарь]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: из_строки
            args: ["купить хлеб|нет"]
            expect_value: {"текст": "купить хлеб", "сделано": false}
          - kind: call
            func: из_строки
            args: ["позвонить|да\n"]
            expect_value: {"текст": "позвонить", "сделано": true}
            hint: Перенос строки в конце нужно убрать через strip().

      - id: t11_p4_t3
        ord: 3
        is_final: true
        statement_md: |
          Последнее задание курса.

          Напиши функцию `сводка`, которая принимает список дел
          и возвращает текст:

          ```
          Всего дел: 3
          Сделано: 1
          Осталось: 2
          - купить хлеб
          - вынести мусор
          ```

          После счётчиков перечисли **несделанные** дела, каждое
          с дефисом впереди, в том порядке, в каком они в списке.

          Если дел нет — верни `Дел нет`.
          Если все сделаны — после счётчиков ничего не добавляй.
        starter_code: |
          def сводка(дела):
        solution: |
          def сводка(дела):
              if len(дела) == 0:
                  return "Дел нет"

              сделано = 0
              осталось = []
              for дело in дела:
                  if дело["сделано"]:
                      сделано += 1
                  else:
                      осталось.append(дело["текст"])

              строки = [
                  f"Всего дел: {len(дела)}",
                  f"Сделано: {сделано}",
                  f"Осталось: {len(осталось)}",
              ]
              for текст in осталось:
                  строки.append(f"- {текст}")

              return "\n".join(строки)
        concepts: [список, словарь, функция, join]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For, If]
          - kind: call
            func: сводка
            args:
              - [{"текст": "купить хлеб", "сделано": false}, {"текст": "позвонить", "сделано": true}, {"текст": "вынести мусор", "сделано": false}]
            expect_value: "Всего дел: 3\nСделано: 1\nОсталось: 2\n- купить хлеб\n- вынести мусор"
          - kind: call
            func: сводка
            args: [[]]
            expect_value: "Дел нет"
          - kind: call
            func: сводка
            args: [[{"текст": "всё готово", "сделано": true}]]
            expect_value: "Всего дел: 1\nСделано: 1\nОсталось: 0"
            hint: Если несделанных нет, список после счётчиков пустой.
