topic:
  id: t09
  ord: 9
  title: Работа с текстом и ошибками

lessons:
  # ======================================================================
  - id: t09_l01
    ord: 1
    title: Что умеет текст
    concepts: [строка, методы строк]
    theory_md: |
      ## Текст — тоже последовательность

      С текстом работают почти как со списком:

      ```
      слово = "Питон"
      print(слово[0])      → П
      print(слово[-1])     → н
      print(len(слово))    → 5
      print(слово[1:3])    → ит
      ```

      И перебирать можно:

      ```
      for буква in "кот":
          print(буква)
      ```

      ## Но менять нельзя

      ```
      слово[0] = "К"    → ошибка
      ```

      Текст в Python неизменяем. Все действия над ним создают **новый**
      текст, а старый остаётся прежним.

      ## Полезные действия

      ```
      текст = "  Привет, Мир!  "

      print(текст.strip())       → "Привет, Мир!"   убрать пробелы по краям
      print(текст.lower())       → "  привет, мир!  "
      print(текст.upper())       → "  ПРИВЕТ, МИР!  "
      print(текст.replace("Мир", "Питон"))
      ```

      Точка означает «сделай с этим текстом вот что».

      Важно: сам `текст` при этом не меняется. Чтобы сохранить результат,
      его надо куда-то положить:

      ```
      чистый = текст.strip()
      ```

      ## Проверки

      ```
      имя = "Анна"
      print(имя.startswith("А"))    → True    начинается с
      print(имя.endswith("на"))     → True    заканчивается на
      print("нн" in имя)            → True    содержит
      ```

      ## Разделить и склеить

      Очень частая пара действий:

      ```
      строка = "хлеб,молоко,сыр"
      товары = строка.split(",")
      print(товары)      → ['хлеб', 'молоко', 'сыр']
      ```

      И обратно:

      ```
      print(", ".join(товары))    → хлеб, молоко, сыр
      ```

      Читается непривычно: «возьми разделитель и склей им список».
      Но пишут именно так.

      ## Где это нужно

      `strip` и `lower` почти всегда применяют к тому, что ввёл человек:

      ```
      ответ = input("Да или нет? ").strip().lower()
      if ответ == "да":
          print("Согласен")
      ```

      Тогда сработает и `Да`, и `ДА`, и ` да ` с пробелами. Без этого
      пользователь вводит «Да» — и программа его не понимает.
    examples:
      - caption: Текст как последовательность
        code: |
          слово = "Питон"
          print(слово[0])
          print(слово[-1])
          print(len(слово))
          print(слово[1:3])
      - caption: Действия над текстом
        code: |
          текст = "  Привет, Мир!  "
          print(текст.strip())
          print(текст.lower())
          print(текст.replace("Мир", "Питон"))
          print(текст)
      - caption: Разделить и склеить
        code: |
          строка = "хлеб,молоко,сыр"
          товары = строка.split(",")
          print(товары)
          print(", ".join(товары))
      - caption: Обработка ответа человека
        stdin: "  ДА  "
        code: |
          ответ = input("Да или нет? ").strip().lower()
          if ответ == "да":
              print("Согласен")
          else:
              print("Не согласен")
    tasks:
      - id: t09_l01_t1
        ord: 1
        statement_md: |
          Напиши функцию `наоборот`, которая принимает текст и возвращает
          его задом наперёд.

          Для `"привет"` должно вернуться `"тевирп"`.

          Подсказка: срез умеет идти с шагом `-1`, то есть в обратную
          сторону: `текст[::-1]`.
        starter_code: |
          def наоборот(текст):
        solution: |
          def наоборот(текст):
              return текст[::-1]
        concepts: [строка, срез]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: наоборот
            args: ["привет"]
            expect_value: "тевирп"
          - kind: call
            func: наоборот
            args: ["а"]
            expect_value: "а"

      - id: t09_l01_t2
        ord: 2
        statement_md: |
          Напиши функцию `нормализовать`, которая принимает текст,
          убирает пробелы по краям и переводит всё в маленькие буквы.

          Для `"  ПрИвЕт  "` должно вернуться `"привет"`.
        starter_code: |
        solution: |
          def нормализовать(текст):
              return текст.strip().lower()
        concepts: [строка, strip, lower]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: нормализовать
            args: ["  ПрИвЕт  "]
            expect_value: "привет"
          - kind: call
            func: нормализовать
            args: ["ДА"]
            expect_value: "да"

      - id: t09_l01_t3
        ord: 3
        statement_md: |
          Напиши функцию `сколько_слов`, которая принимает предложение
          и возвращает количество слов в нём.

          Для `"мама мыла раму"` должно вернуться `3`.

          Подсказка: `split()` без указания разделителя делит по пробелам.
        starter_code: |
        solution: |
          def сколько_слов(предложение):
              return len(предложение.split())
        concepts: [split, len]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: сколько_слов
            args: ["мама мыла раму"]
            expect_value: 3
          - kind: call
            func: сколько_слов
            args: ["одно"]
            expect_value: 1

  # ======================================================================
  - id: t09_l02
    ord: 2
    title: Когда что-то пошло не так
    concepts: [try, except, исключение]
    theory_md: |
      ## Программа не должна падать

      Вот честная программа:

      ```
      возраст = int(input("Возраст: "))
      print(возраст)
      ```

      Человек вводит `двадцать` — и всё останавливается с ошибкой
      `ValueError`. Для пользователя это выглядит как поломка.

      Правильнее — предусмотреть.

      ## try и except

      ```
      try:
          возраст = int(input("Возраст: "))
          print(f"Тебе {возраст}")
      except ValueError:
          print("Это не похоже на число")
      ```

      Читается: «**попробуй** сделать это; **если** случится ValueError —
      сделай вот то».

      Что происходит: Python выполняет то, что внутри `try`. Если всё
      хорошо — `except` пропускается. Если случилась указанная ошибка —
      выполняется `except`, и программа идёт дальше, а не падает.

      ## Ошибку нужно называть

      ```
      except ValueError:      только эта ошибка
      except:                 любая — так лучше не писать
      ```

      Ловить всё подряд — плохая привычка: спрячется и та ошибка,
      о которой вы бы хотели знать. Лучше называть конкретно.

      Частые имена ты уже видел: `ValueError` (не то значение),
      `ZeroDivisionError` (деление на ноль), `KeyError` (нет ключа),
      `IndexError` (нет такого номера).

      ## Несколько веток

      ```
      try:
          a = int(input("Число: "))
          print(100 / a)
      except ValueError:
          print("Это не число")
      except ZeroDivisionError:
          print("На ноль делить нельзя")
      ```

      ## Спрашивать, пока не ответят верно

      Сочетание с циклом даёт надёжный приём:

      ```
      while True:
          try:
              возраст = int(input("Возраст: "))
              break
          except ValueError:
              print("Нужно число, попробуй ещё раз")

      print(f"Тебе {возраст}")
      ```

      `while True` — цикл без условия выхода, крутится всегда. Выйти из
      него можно только через `break`, а он сработает, только если `int`
      не дал ошибки.

      Выглядит хитро, но это один из самых употребительных приёмов.
    examples:
      - caption: Без защиты будет ошибка — запусти и введи слово вместо числа
        stdin: "двадцать"
        code: |
          возраст = int(input("Возраст: "))
          print(возраст)
      - caption: С защитой
        stdin: "двадцать"
        code: |
          try:
              возраст = int(input("Возраст: "))
              print(f"Тебе {возраст}")
          except ValueError:
              print("Это не похоже на число")
      - caption: Две разные ошибки
        stdin: "0"
        code: |
          try:
              a = int(input("Число: "))
              print(100 / a)
          except ValueError:
              print("Это не число")
          except ZeroDivisionError:
              print("На ноль делить нельзя")
      - caption: Спрашиваем, пока не введут число
        stdin: |
          абв
          25
        code: |
          while True:
              try:
                  возраст = int(input("Возраст: "))
                  break
              except ValueError:
                  print("Нужно число, попробуй ещё раз")

          print(f"Тебе {возраст}")
    tasks:
      - id: t09_l02_t1
        ord: 1
        statement_md: |
          Спроси число вопросом `Число: ` и напечатай его квадрат.

          Если ввели не число — напечатай `Это не число` вместо падения.

          Для ввода **5**:

          ```
          Число: 25
          ```

          Для ввода **привет**:

          ```
          Число: Это не число
          ```
        starter_code: |
          try:
        solution: |
          try:
              число = int(input("Число: "))
              print(число * число)
          except ValueError:
              print("Это не число")
        concepts: [try, except]
        tests:
          - kind: ast
            require: [Try]
            hint: Понадобится конструкция try/except.
          - kind: stdout
            stdin: "5"
            expect: "Число: 25"
          - kind: stdout
            stdin: "привет"
            expect: "Число: Это не число"

      - id: t09_l02_t2
        ord: 2
        statement_md: |
          Напиши функцию `безопасное_деление`, которая принимает два числа
          и возвращает результат деления первого на второе.

          Если делят на ноль — функция должна вернуть текст
          `Деление на ноль`, а не ломаться.
        starter_code: |
          def безопасное_деление(a, b):
        solution: |
          def безопасное_деление(a, b):
              try:
                  return a / b
              except ZeroDivisionError:
                  return "Деление на ноль"
        concepts: [try, except, функция]
        tests:
          - kind: ast
            require: [FunctionDef, Try]
          - kind: call
            func: безопасное_деление
            args: [10, 2]
            expect_value: 5.0
          - kind: call
            func: безопасное_деление
            args: [7, 0]
            expect_value: "Деление на ноль"
          - kind: call
            func: безопасное_деление
            args: [0, 5]
            expect_value: 0.0

      - id: t09_l02_t3
        ord: 3
        statement_md: |
          Спрашивай число вопросом `Число: ` до тех пор, пока не введут
          что-то, что действительно является числом.

          На каждый неверный ввод печатай `Нужно число`.
          Когда введут число — напечатай его удвоенное значение.

          Для ввода **абв**, потом **7**:

          ```
          Число: Нужно число
          Число: 14
          ```
        starter_code: |
        solution: |
          while True:
              try:
                  число = int(input("Число: "))
                  break
              except ValueError:
                  print("Нужно число")

          print(число * 2)
        concepts: [try, while, break]
        tests:
          - kind: ast
            require: [Try, While]
            hint: Понадобится цикл, внутри которого try.
          - kind: stdout
            stdin: |
              абв
              7
            expect: |
              Число: Нужно число
              Число: 14
          - kind: stdout
            stdin: "3"
            expect: "Число: 6"

  # ======================================================================
  - id: t09_l03
    ord: 3
    title: Файлы
    concepts: [файл, open, запись, чтение]
    theory_md: |
      ## Программа должна что-то оставлять после себя

      Пока всё, что делали наши программы, исчезало с закрытием. Чтобы
      сохранить — пишут в файл.

      ## Запись

      ```
      with open("заметка.txt", "w", encoding="utf-8") as файл:
          файл.write("Привет\n")
          файл.write("Вторая строка\n")
      ```

      Разберём:

      - `open` — открыть файл;
      - `"заметка.txt"` — имя; файл появится рядом с программой;
      - `"w"` — от *write*, «писать». **Внимание: стирает всё, что было**;
      - `encoding="utf-8"` — обязательно для русского текста, иначе
        на Windows получится мусор;
      - `with ... as файл` — файл закроется сам, даже если случится ошибка;
      - `\n` — переход на новую строку. Без него всё слипнется в одну.

      ## Дописать, не стирая

      ```
      with open("заметка.txt", "a", encoding="utf-8") as файл:
          файл.write("Ещё строка\n")
      ```

      `"a"` — от *append*, «дописать в конец».

      ## Чтение

      ```
      with open("заметка.txt", "r", encoding="utf-8") as файл:
          содержимое = файл.read()

      print(содержимое)
      ```

      `"r"` — от *read*, «читать».

      По строкам:

      ```
      with open("заметка.txt", "r", encoding="utf-8") as файл:
          for строка in файл:
              print(строка.strip())
      ```

      `strip` здесь убирает символ перехода строки, иначе печать выйдет
      с двойными отступами.

      ## Если файла нет

      Чтение несуществующего файла даёт `FileNotFoundError`. Теперь ты
      знаешь, что с этим делать:

      ```
      try:
          with open("заметка.txt", "r", encoding="utf-8") as файл:
              print(файл.read())
      except FileNotFoundError:
          print("Файла пока нет")
      ```

      ## Три буквы, которые надо помнить

      | Буква | Что делает |
      |---|---|
      | `"r"` | читать |
      | `"w"` | писать с нуля, стирая старое |
      | `"a"` | дописывать в конец |

      Перепутать `"w"` и `"a"` — значит потерять данные. Это одна из тех
      ошибок, которые делают все ровно один раз.
    examples:
      - caption: Записываем и читаем
        code: |
          with open("заметка.txt", "w", encoding="utf-8") as файл:
              файл.write("Привет\n")
              файл.write("Вторая строка\n")

          with open("заметка.txt", "r", encoding="utf-8") as файл:
              print(файл.read())
      - caption: Дописываем в конец
        code: |
          with open("список.txt", "w", encoding="utf-8") as файл:
              файл.write("первая\n")

          with open("список.txt", "a", encoding="utf-8") as файл:
              файл.write("вторая\n")

          with open("список.txt", "r", encoding="utf-8") as файл:
              for строка in файл:
                  print(строка.strip())
      - caption: Файла может не быть
        code: |
          try:
              with open("нет_такого.txt", "r", encoding="utf-8") as файл:
                  print(файл.read())
          except FileNotFoundError:
              print("Файла пока нет")
    tasks:
      - id: t09_l03_t1
        ord: 1
        statement_md: |
          Запиши в файл `числа.txt` числа от 1 до 5, каждое на своей
          строке. Потом прочитай файл и напечатай его содержимое.

          Должно получиться:

          ```
          1
          2
          3
          4
          5
          ```

          Не забудь про `encoding="utf-8"` и переход строки.
        starter_code: |
        solution: |
          with open("числа.txt", "w", encoding="utf-8") as файл:
              for число in range(1, 6):
                  файл.write(f"{число}\n")

          with open("числа.txt", "r", encoding="utf-8") as файл:
              for строка in файл:
                  print(строка.strip())
        concepts: [файл, запись, чтение]
        tests:
          - kind: ast
            require: [For]
          - kind: stdout
            expect: |
              1
              2
              3
              4
              5

      - id: t09_l03_t2
        ord: 2
        statement_md: |
          Запиши в файл `слова.txt` три слова: `кот`, `пёс`, `хомяк` —
          каждое на своей строке.

          Потом прочитай файл и напечатай, сколько в нём строк:

          ```
          3
          ```
        starter_code: |
        solution: |
          with open("слова.txt", "w", encoding="utf-8") as файл:
              файл.write("кот\n")
              файл.write("пёс\n")
              файл.write("хомяк\n")

          with open("слова.txt", "r", encoding="utf-8") as файл:
              строки = файл.readlines()

          print(len(строки))
        concepts: [файл, чтение]
        tests:
          - kind: stdout
            expect: "3"
            hint: Прочитать все строки сразу можно через readlines().

      - id: t09_l03_t3
        ord: 3
        statement_md: |
          Попробуй прочитать файл `этого_файла_нет.txt`.

          Если файла нет — напечатай `Файл не найден`, не допуская
          падения программы.

          Должно получиться:

          ```
          Файл не найден
          ```
        starter_code: |
        solution: |
          try:
              with open("этого_файла_нет.txt", "r", encoding="utf-8") as файл:
                  print(файл.read())
          except FileNotFoundError:
              print("Файл не найден")
        concepts: [файл, try, except]
        tests:
          - kind: ast
            require: [Try]
          - kind: stdout
            expect: "Файл не найден"
  # ======================================================================
  - id: t09_final
    ord: 4
    title: Задания по всей теме
    concepts: [строка, try, файл]
    theory_md: |
      ## Проверим, что закрепилось

      Последняя тема перед проектом. Главное:

      - текст неизменяем: все действия дают **новый** текст;
      - `strip().lower()` почти всегда применяют к тому, что ввёл человек;
      - `try/except` не даёт программе упасть;
      - при работе с файлами `encoding="utf-8"` обязателен, а `"w"`
        стирает всё, что было.
    tasks:
      - id: t09_final_t1
        ord: 1
        is_final: true
        statement_md: |
          Напиши функцию `первое_слово`, которая принимает предложение
          и возвращает его первое слово маленькими буквами, без лишних
          пробелов по краям.

          Для `"  Мама мыла раму "` должно вернуться `"мама"`.
        starter_code: |
          def первое_слово(предложение):
        solution: |
          def первое_слово(предложение):
              return предложение.strip().lower().split()[0]
        concepts: [строка, split, strip]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: первое_слово
            args: ["  Мама мыла раму "]
            expect_value: "мама"
          - kind: call
            func: первое_слово
            args: ["ПРИВЕТ"]
            expect_value: "привет"

      - id: t09_final_t2
        ord: 2
        is_final: true
        statement_md: |
          Спрашивай возраст (`Возраст: `), пока не введут число.
          На каждый неверный ввод печатай `Нужно число`.

          Когда введут число — напечатай:

          ```
          Возраст: Тебе 25, через год будет 26
          ```

          (для ввода **абв**, потом **25**)
        starter_code: |
        solution: |
          while True:
              try:
                  возраст = int(input("Возраст: "))
                  break
              except ValueError:
                  print("Нужно число")

          print(f"Тебе {возраст}, через год будет {возраст + 1}")
        concepts: [try, while, f-строка]
        tests:
          - kind: ast
            require: [Try, While]
          - kind: stdout
            stdin: |
              абв
              25
