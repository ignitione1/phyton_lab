topic:
  id: t08
  ord: 8
  title: Словари — значение по названию

lessons:
  # ======================================================================
  - id: t08_l01
    ord: 1
    title: Ключ и значение
    concepts: [словарь, ключ]
    theory_md: |
      ## Когда номер не подходит

      В списке до элемента добираются по номеру. Но номер редко что-то
      значит: попробуй запомнить, что рост человека лежит под номером 2,
      а вес — под номером 3.

      Гораздо понятнее обращаться по названию. Для этого есть **словарь**:

      ```
      человек = {"имя": "Аня", "возраст": 25, "город": "Казань"}
      ```

      Фигурные скобки. Внутри пары «название: значение» через запятую.

      Название называют **ключом**, а то, что под ним лежит, — **значением**.
      Отсюда и название: как в обычном словаре, где по слову находят
      перевод.

      ## Получить значение

      ```
      print(человек["имя"])       → Аня
      print(человек["возраст"])   → 25
      ```

      Квадратные скобки, как у списка, но внутри не номер, а ключ.

      ## Добавить и изменить

      ```
      человек["работа"] = "врач"     добавили новое
      человек["возраст"] = 26        изменили существующее
      ```

      Разницы в записи нет: если ключа не было — появится, если был —
      значение заменится.

      ## Если ключа нет

      ```
      print(человек["рост"])
      ```

      даст ошибку `KeyError: 'рост'`.

      Чтобы не рисковать, есть два способа:

      ```
      if "рост" in человек:
          print(человек["рост"])
      ```

      или сразу со значением на случай отсутствия:

      ```
      print(человек.get("рост", "неизвестно"))
      ```

      `get` вернёт значение, если ключ есть, и то, что указано вторым,
      если нет. Ошибки не будет.

      ## Удалить

      ```
      del человек["город"]
      ```

      ## Чем отличается от списка

      | | Список | Словарь |
      |---|---|---|
      | Скобки | `[ ]` | `{ }` |
      | Обращение | по номеру | по ключу |
      | Порядок | важен | не важен |
      | Когда брать | однородное: оценки, имена | разное об одном: карточка человека |
    examples:
      - caption: Словарь и обращение по ключу
        code: |
          человек = {"имя": "Аня", "возраст": 25, "город": "Казань"}
          print(человек["имя"])
          print(человек["возраст"])
      - caption: Добавляем и меняем
        code: |
          человек = {"имя": "Аня"}
          человек["работа"] = "врач"
          человек["имя"] = "Анна"
          print(человек)
      - caption: Безопасное получение
        code: |
          человек = {"имя": "Аня"}
          print(человек.get("рост", "неизвестно"))
          if "имя" in человек:
              print("Имя есть:", человек["имя"])
      - caption: Ошибка несуществующего ключа — запусти и прочитай
        code: |
          человек = {"имя": "Аня"}
          print(человек["рост"])
    tasks:
      - id: t08_l01_t1
        ord: 1
        statement_md: |
          Создай словарь `книга` с тремя парами:

          - `название` → `Война и мир`
          - `автор` → `Толстой`
          - `год` → `1869`

          Напечатай автора.

          Должно получиться:

          ```
          Толстой
          ```
        starter_code: |
        solution: |
          книга = {"название": "Война и мир", "автор": "Толстой", "год": 1869}
          print(книга["автор"])
        concepts: [словарь, ключ]
        tests:
          - kind: stdout
            expect: "Толстой"
          - kind: ast
            require: [Dict]
            hint: Нужно создать именно словарь — в фигурных скобках.

      - id: t08_l01_t2
        ord: 2
        statement_md: |
          Дан словарь:

          ```
          товар = {"название": "хлеб", "цена": 45}
          ```

          Добавь в него ключ `в_наличии` со значением `True`,
          измени цену на 50 и напечатай весь словарь.

          Должно получиться:

          ```
          {'название': 'хлеб', 'цена': 50, 'в_наличии': True}
          ```
        starter_code: |
          товар = {"название": "хлеб", "цена": 45}
        solution: |
          товар = {"название": "хлеб", "цена": 45}
          товар["цена"] = 50
          товар["в_наличии"] = True
          print(товар)
        concepts: [словарь]
        tests:
          - kind: stdout
            expect: "{'название': 'хлеб', 'цена': 50, 'в_наличии': True}"
            hint: Сначала измени цену, потом добавь новый ключ.

      - id: t08_l01_t3
        ord: 3
        statement_md: |
          Дан словарь:

          ```
          настройки = {"язык": "русский", "тема": "тёмная"}
          ```

          Напечатай значение ключа `размер`. Если такого ключа нет —
          должно напечататься `по умолчанию`, а не ошибка.

          Должно получиться:

          ```
          по умолчанию
          ```
        starter_code: |
          настройки = {"язык": "русский", "тема": "тёмная"}
        solution: |
          настройки = {"язык": "русский", "тема": "тёмная"}
          print(настройки.get("размер", "по умолчанию"))
        concepts: [словарь, get]
        tests:
          - kind: stdout
            expect: "по умолчанию"
            hint: Есть способ получить значение без риска ошибки.

  # ======================================================================
  - id: t08_l02
    ord: 2
    title: Перебор словаря
    concepts: [items, перебор словаря]
    theory_md: |
      ## Пройти по всем парам

      ```
      цены = {"хлеб": 45, "молоко": 80, "сыр": 350}

      for товар, цена in цены.items():
          print(f"{товар}: {цена} руб.")
      ```

      `items` выдаёт пары, и в цикле сразу две переменные: первая получает
      ключ, вторая — значение. Имена придумываешь сам.

      ## Только ключи или только значения

      ```
      for товар in цены:
          print(товар)              → хлеб, молоко, сыр

      for цена in цены.values():
          print(цена)               → 45, 80, 350
      ```

      Если написать просто `for x in цены`, перебираются **ключи**.
      Это частая путаница: кажется, что должны значения, а идут ключи.

      ## Считаем по словарю

      ```
      цены = {"хлеб": 45, "молоко": 80, "сыр": 350}

      итог = 0
      for цена in цены.values():
          итог += цена

      print("Всего:", итог)
      ```

      Или короче: `print(sum(цены.values()))`.

      ## Отбор с условием

      ```
      дешёвые = []
      for товар, цена in цены.items():
          if цена < 100:
              дешёвые.append(товар)

      print(дешёвые)    → ['хлеб', 'молоко']
      ```

      ## Подсчёт — задача, где словарь незаменим

      Посчитать, сколько раз встретилась каждая буква:

      ```
      слово = "колобок"
      счёт = {}

      for буква in слово:
          if буква in счёт:
              счёт[буква] += 1
          else:
              счёт[буква] = 1

      print(счёт)
      ```

      Получится `{'к': 2, 'о': 3, 'л': 1, 'б': 1}`.

      Приём: если ключ уже есть — увеличиваем, если нет — заводим с единицей.
      Запомни его, он встречается постоянно.

      Кстати, здесь видно, что по тексту тоже можно идти циклом —
      он выдаёт буквы по одной.
    examples:
      - caption: Перебираем пары
        code: |
          цены = {"хлеб": 45, "молоко": 80, "сыр": 350}
          for товар, цена in цены.items():
              print(f"{товар}: {цена} руб.")
      - caption: Сумма значений
        code: |
          цены = {"хлеб": 45, "молоко": 80, "сыр": 350}
          print("Всего:", sum(цены.values()))
      - caption: Считаем буквы
        code: |
          слово = "колобок"
          счёт = {}
          for буква in слово:
              if буква in счёт:
                  счёт[буква] += 1
              else:
                  счёт[буква] = 1
          print(счёт)
    tasks:
      - id: t08_l02_t1
        ord: 1
        statement_md: |
          Дан словарь:

          ```
          оценки = {"математика": 5, "русский": 4, "история": 3}
          ```

          Напечатай каждый предмет с оценкой, по строке на предмет:

          ```
          математика: 5
          русский: 4
          история: 3
          ```
        starter_code: |
          оценки = {"математика": 5, "русский": 4, "история": 3}
        solution: |
          оценки = {"математика": 5, "русский": 4, "история": 3}
          for предмет, оценка in оценки.items():
              print(f"{предмет}: {оценка}")
        concepts: [items, перебор словаря]
        tests:
          - kind: ast
            require: [For]
            hint: Нужен цикл по парам.
          - kind: stdout
            expect: |
              математика: 5
              русский: 4
              история: 3

      - id: t08_l02_t2
        ord: 2
        statement_md: |
          Тот же словарь оценок.

          Напечатай средний балл с двумя знаками после точки:

          ```
          Средний балл: 4.00
          ```
        starter_code: |
          оценки = {"математика": 5, "русский": 4, "история": 3}
        solution: |
          оценки = {"математика": 5, "русский": 4, "история": 3}
          среднее = sum(оценки.values()) / len(оценки)
          print(f"Средний балл: {среднее:.2f}")
        concepts: [словарь, среднее]
        tests:
          - kind: stdout
            expect: "Средний балл: 4.00"
            hint: Сумму значений даёт sum(словарь.values()).

      - id: t08_l02_t3
        ord: 3
        statement_md: |
          Посчитай, сколько раз каждая буква встречается в слове
          `программирование`, и напечатай получившийся словарь.

          Начни с пустого словаря и иди по буквам циклом.
        starter_code: |
          слово = "программирование"
          счёт = {}
        solution: |
          слово = "программирование"
          счёт = {}
          for буква in слово:
              if буква in счёт:
                  счёт[буква] += 1
              else:
                  счёт[буква] = 1
          print(счёт)
        concepts: [словарь, подсчёт, for]
        tests:
          - kind: ast
            require: [For, If]
            hint: Понадобится цикл с проверкой, есть ли уже такой ключ.
          - kind: stdout
            expect: "{'п': 1, 'р': 3, 'о': 2, 'г': 1, 'а': 2, 'м': 2, 'и': 2, 'в': 1, 'н': 1, 'е': 1}"

  # ======================================================================
  - id: t08_l03
    ord: 3
    title: Кортежи и множества
    concepts: [кортеж, множество]
    theory_md: |
      ## Кортеж — список, который нельзя менять

      ```
      координаты = (55.75, 37.61)
      ```

      Круглые скобки вместо квадратных. Работает как список:

      ```
      print(координаты[0])    → 55.75
      print(len(координаты))  → 2
      ```

      Но изменить нельзя:

      ```
      координаты[0] = 10      → ошибка
      ```

      ## Зачем такое ограничение

      Ровно затем, что ограничение. Если значения меняться не должны —
      кортеж не даст их испортить по невнимательности.

      Кортежи берут для того, что по смыслу цельное: координаты точки,
      дата, размеры экрана. Список — для того, что растёт и меняется.

      ## Несколько значений сразу

      Кортежи позволяют вот такой приём:

      ```
      a, b = 1, 2
      print(a, b)     → 1 2
      ```

      И обмен значениями в одну строку:

      ```
      a, b = b, a
      ```

      В других языках для этого нужна третья переменная.

      Функция тоже может вернуть несколько значений:

      ```
      def минимум_и_максимум(числа):
          return min(числа), max(числа)

      наименьшее, наибольшее = минимум_и_максимум([3, 7, 2])
      print(наименьшее, наибольшее)    → 2 7
      ```

      ## Множество — только уникальное

      ```
      числа = {1, 2, 2, 3, 3, 3}
      print(числа)    → {1, 2, 3}
      ```

      Фигурные скобки, но без пар. Повторы отбрасываются сами.

      Главное применение — убрать повторы из списка:

      ```
      имена = ["Аня", "Пётр", "Аня", "Борис"]
      уникальные = set(имена)
      print(len(уникальные))    → 3
      ```

      Порядок в множестве не хранится, обращаться по номеру нельзя.

      ## Что выбрать

      - **список** — обычный случай, порядок важен, повторы допустимы;
      - **кортеж** — набор не должен меняться;
      - **словарь** — доступ по названию;
      - **множество** — важна только уникальность.
    examples:
      - caption: Кортеж
        code: |
          координаты = (55.75, 37.61)
          print(координаты[0])
          print(len(координаты))
      - caption: Обмен значениями
        code: |
          a = 1
          b = 2
          a, b = b, a
          print(a, b)
      - caption: Функция возвращает два значения
        code: |
          def минимум_и_максимум(числа):
              return min(числа), max(числа)

          наименьшее, наибольшее = минимум_и_максимум([3, 7, 2])
          print(наименьшее, наибольшее)
      - caption: Убираем повторы
        code: |
          имена = ["Аня", "Пётр", "Аня", "Борис"]
          уникальные = set(имена)
          print(len(уникальные))
    tasks:
      - id: t08_l03_t1
        ord: 1
        statement_md: |
          Дан список с повторами:

          ```
          числа = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3]
          ```

          Напечатай, сколько в нём **различных** чисел.

          Должно получиться:

          ```
          7
          ```
        starter_code: |
          числа = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3]
        solution: |
          числа = [3, 1, 4, 1, 5, 9, 2, 6, 5, 3]
          print(len(set(числа)))
        concepts: [множество]
        tests:
          - kind: stdout
            expect: "7"
            hint: Множество само отбрасывает повторы.

      - id: t08_l03_t2
        ord: 2
        statement_md: |
          Напиши функцию `границы`, которая принимает список чисел
          и возвращает **два значения**: наименьшее и наибольшее.

          Для `[3, 7, 2]` должно вернуться `(2, 7)`.
        starter_code: |
          def границы(числа):
        solution: |
          def границы(числа):
              return min(числа), max(числа)
        concepts: [кортеж, функция]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: границы
            args: [[3, 7, 2]]
            expect_value: [2, 7]
          - kind: call
            func: границы
            args: [[5]]
            expect_value: [5, 5]

      - id: t08_l03_t3
        ord: 3
        statement_md: |
          Даны два списка участников:

          ```
          утро = ["Аня", "Пётр", "Борис"]
          вечер = ["Пётр", "Вера", "Аня"]
          ```

          Напечатай, сколько всего **разных** людей участвовало.

          Должно получиться:

          ```
          4
          ```

          Подсказка: два списка можно соединить знаком `+`.
        starter_code: |
          утро = ["Аня", "Пётр", "Борис"]
          вечер = ["Пётр", "Вера", "Аня"]
        solution: |
          утро = ["Аня", "Пётр", "Борис"]
          вечер = ["Пётр", "Вера", "Аня"]
          print(len(set(утро + вечер)))
        concepts: [множество, список]
        tests:
          - kind: stdout
            expect: "4"
            hint: Сначала соедини списки, потом убери повторы.
  # ======================================================================
  - id: t08_final
    ord: 4
    title: Задания по всей теме
    concepts: [словарь, items, множество]
    theory_md: |
      ## Проверим, что закрепилось

      Словарь хранит значение по названию, а не по номеру. Главное:

      - `словарь[ключ]` падает, если ключа нет; `get` — не падает;
      - `for ключ in словарь` идёт по **ключам**, `items()` даёт пары;
      - множество нужно, когда важна только уникальность.
    tasks:
      - id: t08_final_t1
        ord: 1
        is_final: true
        statement_md: |
          Дан словарь остатков на складе:

          ```
          склад = {"хлеб": 12, "молоко": 0, "сыр": 5, "масло": 0}
          ```

          Напечатай список товаров, которых нет в наличии, по алфавиту:

          ```
          ['масло', 'молоко']
          ```
        starter_code: |
          склад = {"хлеб": 12, "молоко": 0, "сыр": 5, "масло": 0}
        solution: |
          склад = {"хлеб": 12, "молоко": 0, "сыр": 5, "масло": 0}
          закончились = []
          for товар, сколько in склад.items():
              if сколько == 0:
                  закончились.append(товар)
          print(sorted(закончились))
        concepts: [словарь, items, sorted]
        tests:
          - kind: ast
            require: [For, If]
          - kind: stdout
            expect: "['масло', 'молоко']"

      - id: t08_final_t2
        ord: 2
        is_final: true
        statement_md: |
          Напиши функцию `самый_частый`, которая принимает текст
          и возвращает букву, встречающуюся в нём чаще всего.

          Для `"колобок"` это `"о"` — она встречается три раза.
        starter_code: |
          def самый_частый(текст):
        solution: |
          def самый_частый(текст):
              счёт = {}
              for буква in текст:
                  if буква in счёт:
                      счёт[буква] += 1
                  else:
                      счёт[буква] = 1

              лучшая = текст[0]
              for буква, сколько in счёт.items():
                  if сколько > счёт[лучшая]:
                      лучшая = буква
              return лучшая
        concepts: [словарь, подсчёт, функция]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For, If]
          - kind: call
            func: самый_частый
            args: ["колобок"]
            expect_value: "о"
          - kind: call
            func: самый_частый
            args: ["ааб"]
            expect_value: "а"

      - id: t08_final_t3
        ord: 3
        is_final: true
        statement_md: |
          Даны два списка участников кружков:

          ```
          шахматы = ["Аня", "Пётр", "Борис"]
          рисование = ["Вера", "Аня", "Пётр"]
          ```

          Напечатай две строки: сколько всего разных людей и сколько
          из них ходят в оба кружка.

          ```
          Всего человек: 4
          В обоих кружках: 2
          ```

          Подсказка: у множеств есть действие `intersection` —
          «то, что есть и там, и там».
        starter_code: |
          шахматы = ["Аня", "Пётр", "Борис"]
          рисование = ["Вера", "Аня", "Пётр"]
        solution: |
          шахматы = ["Аня", "Пётр", "Борис"]
          рисование = ["Вера", "Аня", "Пётр"]
          все = set(шахматы + рисование)
          оба = set(шахматы).intersection(set(рисование))
          print(f"Всего человек: {len(все)}")
          print(f"В обоих кружках: {len(оба)}")
