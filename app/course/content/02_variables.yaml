topic:
  id: t02
  ord: 2
  title: Переменные и ввод

lessons:
  # ======================================================================
  - id: t02_l01
    ord: 1
    title: Переменные — подписанные коробки
    concepts: [переменная, присваивание]
    theory_md: |
      ## Зачем что-то запоминать

      Пока наши программы всё делали сразу: посчитали — напечатали, забыли.
      Но обычно результат нужен дальше. Для этого его кладут в **переменную**.

      Проще всего представить переменную как **коробку с наклейкой**.
      На наклейке — имя, внутри — значение.

      ```
      возраст = 25
      ```

      Читается справа налево: «возьми число 25 и положи в коробку с именем
      `возраст`». Знак `=` здесь не «равно» из математики, а «положи в».

      ## Как пользоваться

      Дальше в программе можно писать имя вместо значения:

      ```
      возраст = 25
      print(возраст)
      ```

      напечатает `25`. Python подставит то, что лежит в коробке.

      ## Значение можно заменить

      ```
      счёт = 10
      счёт = 20
      print(счёт)
      ```

      напечатает `20`. Новое значение вытесняет старое — в коробке
      помещается только одна вещь.

      ## Имена

      Имя придумываешь сам, но по правилам:

      - только буквы, цифры и знак подчёркивания `_`;
      - не может начинаться с цифры;
      - без пробелов: пишут `имя_кота`, а не `имя кота`;
      - большие и маленькие буквы различаются: `Счёт` и `счёт` — две разные коробки.

      Имя стоит делать понятным. `x` через неделю ничего не скажет,
      а `цена_билета` скажет.

      ## В коробку кладут и текст

      ```
      имя = "Аня"
      print(имя)
      ```

      Правило то же, что и раньше: текст — в кавычках, числа — без.
    examples:
      - caption: Положили и напечатали
        code: |
          возраст = 25
          print(возраст)
      - caption: Переменные можно складывать
        code: |
          яблоки = 4
          груши = 3
          print(яблоки + груши)
      - caption: Новое значение вытесняет старое
        code: |
          счёт = 10
          print(счёт)
          счёт = 20
          print(счёт)
    tasks:
      - id: t02_l01_t1
        ord: 1
        statement_md: |
          Создай переменную с именем `город`, положи в неё текст **Москва**
          и напечатай её.

          Должно получиться:

          ```
          Москва
          ```
        starter_code: |
        solution: |
          город = "Москва"
          print(город)
        concepts: [переменная]
        tests:
          - kind: stdout
            expect: "Москва"
          - kind: ast
            require: [Assign]
            hint: Нужно именно создать переменную, а не печатать текст напрямую.

      - id: t02_l01_t2
        ord: 2
        statement_md: |
          В корзине 12 яблок и 8 груш.

          Создай две переменные, положи в них эти числа, а потом напечатай,
          сколько всего фруктов.

          Должно получиться:

          ```
          20
          ```
        starter_code: |
          яблоки = 12
          груши =
        solution: |
          яблоки = 12
          груши = 8
          print(яблоки + груши)
        concepts: [переменная, сложение]
        tests:
          - kind: stdout
            expect: "20"
          - kind: ast
            require: [Assign, BinOp]
            hint: Складывать надо переменные, а не писать готовый ответ.

      - id: t02_l01_t3
        ord: 3
        statement_md: |
          Создай переменную `цена` со значением 100.

          Напечатай её. Потом положи в ту же переменную число 150
          и напечатай снова.

          Должно получиться:

          ```
          100
          150
          ```
        starter_code: |
        solution: |
          цена = 100
          print(цена)
          цена = 150
          print(цена)
        concepts: [переменная, присваивание]
        tests:
          - kind: stdout
            expect: |
              100
              150

  # ======================================================================
  - id: t02_l02
    ord: 2
    title: Программа спрашивает
    concepts: [input, ввод]
    theory_md: |
      ## Пусть спросит

      До сих пор все данные мы вписывали в код сами. Настоящие программы
      спрашивают у человека. Для этого есть команда `input`.

      ```
      имя = input("Как тебя зовут? ")
      print("Привет,", имя)
      ```

      Что происходит по шагам:

      1. `input` показывает вопрос `Как тебя зовут?` и **останавливает**
         программу;
      2. человек печатает ответ и нажимает Enter;
      3. напечатанное попадает в переменную `имя`;
      4. программа идёт дальше.

      Внизу, в консоли, появится поле для ввода — туда и печатай.

      ## Запятая в print

      Заметь: `print("Привет,", имя)` — через запятую. Так можно
      перечислять сколько угодно кусков, Python поставит между ними
      пробел сам:

      ```
      print("Привет,", имя, "! Рад встрече.")
      ```

      ## Вопрос лучше писать с пробелом на конце

      ```
      input("Как тебя зовут? ")
      ```

      Пробел после вопросительного знака нужен, чтобы ответ не прилипал
      к вопросу вплотную. Мелочь, но читается приятнее.

      ## Важное, что аукнется в следующем уроке

      **`input` всегда возвращает текст.** Даже если человек напечатал `25`,
      в переменной окажется текст `"25"`, а не число 25. Выглядит одинаково,
      но вести себя будет по-разному. Об этом — следующий урок.
    examples:
      - caption: Спрашиваем имя
        stdin: "Аня"
        code: |
          имя = input("Как тебя зовут? ")
          print("Привет,", имя)
      - caption: Два вопроса подряд
        stdin: |
          Аня
          Москва
        code: |
          имя = input("Имя: ")
          город = input("Город: ")
          print(имя, "живёт в городе", город)
    tasks:
      - id: t02_l02_t1
        ord: 1
        statement_md: |
          Спроси у человека его имя и поздоровайся.

          Вопрос должен быть таким: `Имя: `

          Если ввести **Аня**, должно получиться:

          ```
          Имя: Привет, Аня
          ```

          Вопрос и ответ оказываются в одной строке — так и должно быть.
        starter_code: |
        solution: |
          имя = input("Имя: ")
          print("Привет,", имя)
        concepts: [input]
        tests:
          - kind: stdout
            stdin: "Аня"
            expect: "Имя: Привет, Аня"
            hint: После вопроса используй print с двумя кусками через запятую.

      - id: t02_l02_t2
        ord: 2
        statement_md: |
          Спроси два раза: сначала любимый цвет, потом любимое блюдо.

          Вопросы: `Цвет: ` и `Блюдо: `

          Потом напечатай ответ в таком виде (если ввели **синий** и **борщ**):

          ```
          Цвет: Блюдо: Твой цвет синий , а блюдо борщ
          ```

          Подсказка: в `print` перечисли куски через запятую.
        starter_code: |
        solution: |
          цвет = input("Цвет: ")
          блюдо = input("Блюдо: ")
          print("Твой цвет", цвет, ", а блюдо", блюдо)
        concepts: [input]
        tests:
          - kind: stdout
            stdin: |
              синий
              борщ
            expect_contains:
              - "Твой цвет синий"
              - "а блюдо борщ"
            hint: Понадобятся две команды input и одна print.

  # ======================================================================
  - id: t02_l03
    ord: 3
    title: Текст и числа — разные вещи
    concepts: [тип, int, преобразование]
    theory_md: |
      ## Почему это важно

      Вот программа, которая выглядит правильной, но ломается:

      ```
      возраст = input("Возраст: ")
      print(возраст + 1)
      ```

      Ошибка: `TypeError: can only concatenate str (not "int") to str`.

      Перевод: «текст можно склеивать только с текстом».

      Дело в том, что `input` вернул **текст** `"25"`, а не число 25.
      К тексту нельзя прибавить единицу — это как попросить прибавить
      единицу к слову «кошка».

      ## Два разных мира

      | Что это | Как выглядит | Что с ним можно |
      |---|---|---|
      | Текст (`str`) | `"25"` | склеивать, показывать |
      | Число (`int`) | `25` | складывать, умножать, сравнивать |

      Выглядят одинаково, ведут себя по-разному.

      ## Как перевести текст в число

      Есть команда `int` — она превращает текст из цифр в настоящее число:

      ```
      возраст = int(input("Возраст: "))
      print(возраст + 1)
      ```

      Теперь работает. Разберём запись изнутри наружу:

      1. `input("Возраст: ")` — спросил, получил текст `"25"`;
      2. `int(...)` — превратил текст в число `25`;
      3. `возраст = ...` — положил число в коробку.

      Скобки читаются как матрёшка: сначала выполняется самое внутреннее.

      ## Для дробных есть float

      Если число может быть с запятой — например, рост 1.75 — берут `float`:

      ```
      рост = float(input("Рост в метрах: "))
      ```

      В Python дробную часть отделяют **точкой**, а не запятой: `1.75`.

      ## Обратно тоже можно

      `str` превращает число в текст:

      ```
      возраст = 25
      print("Мне " + str(возраст) + " лет")
      ```

      Хотя проще через запятую: `print("Мне", возраст, "лет")`.
    examples:
      - caption: Сломанная программа — запусти и прочитай ошибку
        code: |
          возраст = input("Возраст: ")
          print(возраст + 1)
      - caption: Починенная версия
        stdin: "25"
        code: |
          возраст = int(input("Возраст: "))
          print("Через год будет", возраст + 1)
      - caption: Дробное число
        stdin: "1.75"
        code: |
          рост = float(input("Рост в метрах: "))
          print("В сантиметрах это", рост * 100)
    tasks:
      - id: t02_l03_t1
        ord: 1
        statement_md: |
          Спроси число вопросом `Число: ` и напечатай это число, увеличенное
          на 10.

          Если ввести **5**, должно получиться:

          ```
          Число: 15
          ```
        starter_code: |
          число = input("Число: ")
          print(число + 10)
        solution: |
          число = int(input("Число: "))
          print(число + 10)
        concepts: [int, преобразование]
        tests:
          - kind: stdout
            stdin: "5"
            expect: "Число: 15"
            hint: input даёт текст — его нужно превратить в число командой int.

      - id: t02_l03_t2
        ord: 2
        statement_md: |
          Спроси два числа вопросами `Первое: ` и `Второе: `,
          напечатай их произведение (результат умножения).

          Если ввести **6** и **7**, должно получиться:

          ```
          Первое: Второе: 42
          ```
        starter_code: |
        solution: |
          a = int(input("Первое: "))
          b = int(input("Второе: "))
          print(a * b)
        concepts: [int, умножение]
        tests:
          - kind: stdout
            stdin: |
              6
              7
            expect: "Первое: Второе: 42"
            hint: Оба ответа нужно превратить в числа через int.
          - kind: ast
            require: [BinOp]
            hint: Пусть умножает компьютер.

      - id: t02_l03_t3
        ord: 3
        statement_md: |
          Спроси, сколько человеку лет: `Возраст: `

          Напечатай, сколько ему будет через 10 лет, в таком виде
          (для ответа **30**):

          ```
          Возраст: Через 10 лет тебе будет 40
          ```
        starter_code: |
        solution: |
          возраст = int(input("Возраст: "))
          print("Через 10 лет тебе будет", возраст + 10)
        concepts: [int, переменная]
        tests:
          - kind: stdout
            stdin: "30"
            expect: "Возраст: Через 10 лет тебе будет 40"
          - kind: ast
            require: [BinOp]
            hint: Прибавь 10 к переменной, а не пиши готовый ответ.
  # ======================================================================
  - id: t02_final
    ord: 4
    title: Задания по всей теме
    concepts: [переменная, input, int]
    theory_md: |
      ## Проверим, что закрепилось

      В этой теме было три важные вещи, и в заданиях ниже они встречаются
      вместе:

      - переменная как подписанная коробка;
      - `input` — программа спрашивает;
      - `int` — то, что пришло из `input`, это текст, и для счёта его надо
        превратить в число.

      Последнее — главная ловушка темы. Если программа падает с
      `TypeError`, скорее всего забыт `int`.
    tasks:
      - id: t02_final_t1
        ord: 1
        is_final: true
        statement_md: |
          Спроси имя (`Имя: `) и год рождения (`Год: `).

          Напечатай, сколько человеку исполнится в 2030 году,
          в таком виде (для **Аня** и **2000**):

          ```
          Имя: Год: Аня, в 2030 тебе будет 30
          ```
        starter_code: |
        solution: |
          имя = input("Имя: ")
          год = int(input("Год: "))
          print(имя, ", в 2030 тебе будет", 2030 - год)
        concepts: [input, int, переменная]
        tests:
          - kind: stdout
            stdin: |
              Аня
              2000
            expect_contains:
              - "Аня"
              - "в 2030 тебе будет 30"
            hint: Год нужно превратить в число, иначе вычесть не получится.
          - kind: ast
            require: [BinOp]

      - id: t02_final_t2
        ord: 2
        is_final: true
        statement_md: |
          Спроси цену товара (`Цена: `) и количество (`Сколько: `).

          Напечатай общую стоимость:

          ```
          Цена: Сколько: Итого: 450
          ```

          (для цены **150** и количества **3**)
        starter_code: |
        solution: |
          цена = int(input("Цена: "))
          сколько = int(input("Сколько: "))
          print("Итого:", цена * сколько)
        concepts: [input, int, умножение]
        tests:
          - kind: stdout
            stdin: |
              150
              3
            expect: "Цена: Сколько: Итого: 450"
          - kind: stdout
            stdin: |
              99
              2
            expect: "Цена: Сколько: Итого: 198"

      - id: t02_final_t3
        ord: 3
        is_final: true
        statement_md: |
          Спроси два числа (`Первое: ` и `Второе: `) и напечатай их сумму
          и произведение, каждое на своей строке.

          Для **4** и **5**:

          ```
          Первое: Второе: 9
          20
          ```
        starter_code: |
        solution: |
          a = int(input("Первое: "))
          b = int(input("Второе: "))
          print(a + b)
          print(a * b)
        concepts: [input, int, переменная]
        tests:
          - kind: stdout
            stdin: |
              4
              5
            expect: |
              Первое: Второе: 9
              20
          - kind: stdout
            stdin: |
              10
              10
            expect: |
              Первое: Второе: 20
              100
