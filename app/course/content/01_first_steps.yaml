topic:
  id: t01
  ord: 1
  title: Первые шаги

lessons:
  # ======================================================================
  - id: t01_l01
    ord: 1
    title: Что такое программа
    concepts: [print, строка]
    theory_md: |
      ## Что вообще происходит

      Компьютер сам по себе ничего не решает. Он умеет только выполнять
      указания — по одному, сверху вниз, ровно в том порядке, как написано.

      **Программа** — это и есть список таких указаний, записанных текстом.
      Ты пишешь строчки, нажимаешь «Запустить», компьютер читает их сверху
      вниз и делает, что сказано.

      ## Первое указание: напечатай

      Чаще всего начинают с того, чтобы попросить компьютер что-нибудь
      показать. Для этого есть команда `print` — по-английски «печатай».

      ```
      print("Привет")
      ```

      Разберём по частям, потому что тут важна каждая мелочь:

      - `print` — название команды. Пишется маленькими буквами, без пробелов.
      - `(` и `)` — круглые скобки. Внутри них кладут то, что нужно напечатать.
      - `"Привет"` — текст в кавычках. Кавычки говорят: «это просто буквы,
        не пытайся их понять, а покажи как есть».

      Результат появляется внизу, в чёрном окне. Оно называется **консоль** —
      это место, где программа разговаривает с тобой.

      ## Почему кавычки обязательны

      Без кавычек Python решит, что `Привет` — это имя чего-то, что ты
      создал раньше. Не найдёт и остановится с ошибкой. Кавычки — знак
      «здесь просто текст».

      Кавычки можно брать двойные `"так"` или одинарные `'так'` — разницы
      нет. Главное, чтобы открывающая и закрывающая были одинаковые.
    examples:
      - caption: Самая простая программа
        code: |
          print("Привет")
      - caption: Несколько указаний подряд — выполнятся сверху вниз
        code: |
          print("Первая строка")
          print("Вторая строка")
          print("Третья строка")
    tasks:
      - id: t01_l01_t1
        ord: 1
        statement_md: |
          Напечатай в консоли текст:

          **Привет, мир!**

          Именно так, с запятой и восклицательным знаком.
        starter_code: |
          # Напиши свою команду ниже
        solution: |
          print("Привет, мир!")
        concepts: [print]
        tests:
          - kind: stdout
            expect: "Привет, мир!"
            hint: Проверь, что текст внутри кавычек написан точь-в-точь.

      - id: t01_l01_t2
        ord: 2
        statement_md: |
          Напечатай **две** строки, одну под другой:

          ```
          Меня зовут Python
          Я выполняю команды
          ```

          Подсказка: понадобятся две команды `print`, одна под другой.
        starter_code: |
        solution: |
          print("Меня зовут Python")
          print("Я выполняю команды")
        concepts: [print]
        tests:
          - kind: stdout
            expect: |
              Меня зовут Python
              Я выполняю команды

      - id: t01_l01_t3
        ord: 3
        statement_md: |
          Напечатай своё имя — любое, какое захочешь.

          Здесь нет единственного правильного ответа: нужно просто, чтобы
          программа что-нибудь напечатала с помощью `print`.
        starter_code: |
        solution: |
          print("Игорь")
        concepts: [print]
        tests:
          - kind: ast
            require: [Call]
            hint: Нужно воспользоваться командой print().
          - kind: stdout
            nonempty: true
            hint: Программа должна что-то напечатать.

  # ======================================================================
  - id: t01_l02
    ord: 2
    title: Когда Python не понимает
    concepts: [ошибка, кавычки, скобки]
    theory_md: |
      ## Ошибка — это нормально

      Сейчас будет важное. Когда программа не работает, начинающие часто
      пугаются и думают, что сломали компьютер. Ничего подобного.

      **Ошибка — это просто сообщение «я не понял, объясни иначе».**
      Программисты с двадцатилетним опытом видят ошибки каждый день.
      Разница только в том, что они научились их читать.

      ## Как читать ошибку

      Если запустить вот это:

      ```
      print("Привет)
      ```

      внизу появится красный текст, а в нём — строка вроде:

      ```
      SyntaxError: unterminated string literal
      ```

      Смысл: `SyntaxError` — ошибка записи, что-то написано не по правилам.
      А `unterminated string literal` — «незакрытый текст»: кавычка открылась
      и не закрылась.

      Читать всё сообщение целиком не нужно. **Смотри на последнюю строку** —
      в ней и написана суть. И на номер строки: слева в редакторе появится
      красная точка ровно там, где споткнулся Python.

      ## Три ошибки, которые делают все

      **Забыли закрыть кавычку** — `print("Привет)`
      **Забыли закрыть скобку** — `print("Привет"`
      **Опечатались в команде** — `prnt("Привет")`

      Последняя даст другое сообщение: `NameError: name 'prnt' is not defined`.
      Это значит «не знаю такого слова». Python не догадывается, что ты имел
      в виду, — он требует точности.

      ## Комментарии

      Иногда нужно оставить заметку для себя, а не команду для компьютера.
      Для этого есть решётка `#`:

      ```
      # Это заметка, Python её не читает
      print("А это выполнится")
      ```

      Всё, что после `#` до конца строки, компьютер пропускает.
    examples:
      - caption: Сломанная программа — запусти и прочитай ошибку
        code: |
          print("Привет)
      - caption: Опечатка в названии команды
        code: |
          prnt("Привет")
      - caption: Заметки для человека
        code: |
          # Сначала здороваемся
          print("Здравствуйте")
          # Потом прощаемся
          print("До свидания")
    tasks:
      - id: t01_l02_t1
        ord: 1
        statement_md: |
          Перед тобой сломанная программа. Почини её так, чтобы она
          напечатала:

          **Всё работает**

          ```
          print("Всё работает
          ```
        starter_code: |
          print("Всё работает
        solution: |
          print("Всё работает")
        concepts: [кавычки, скобки]
        tests:
          - kind: stdout
            expect: "Всё работает"
            hint: Не хватает закрывающей кавычки и закрывающей скобки.

      - id: t01_l02_t2
        ord: 2
        statement_md: |
          И ещё одна сломанная программа. Она должна напечатать:

          **Ошибки не страшны**

          ```
          prnt("Ошибки не страшны")
          ```
        starter_code: |
          prnt("Ошибки не страшны")
        solution: |
          print("Ошибки не страшны")
        concepts: [опечатка]
        tests:
          - kind: stdout
            expect: "Ошибки не страшны"
            hint: Посмотри внимательно на название команды — в нём пропущена буква.

      - id: t01_l02_t3
        ord: 3
        statement_md: |
          Напиши программу из двух строк:

          1. Заметка-комментарий с любым текстом (начинается с `#`).
          2. Команда, печатающая **Готово**.

          Комментарий в консоли не появится — так и должно быть.
        starter_code: |
        solution: |
          # Печатаем сообщение
          print("Готово")
        concepts: [комментарий]
        tests:
          - kind: stdout
            expect: "Готово"
          - kind: ast
            require: [Call]
            hint: Нужна команда print().

  # ======================================================================
  - id: t01_l03
    ord: 3
    title: Числа и вычисления
    concepts: [число, сложение, print]
    theory_md: |
      ## Числа пишут без кавычек

      Мы уже печатали текст. Теперь числа — и тут есть важная разница:

      ```
      print("7")   ← текст, просто значок семёрки
      print(7)     ← число, с которым можно считать
      ```

      В консоли обе строки покажут `7`. Но для Python это разные вещи,
      как нарисованное на бумаге яблоко и настоящее.

      ## Компьютер считает

      Если внутри скобок написать вычисление, Python посчитает и напечатает
      **результат**, а не само выражение:

      ```
      print(2 + 3)
      ```

      напечатает `5`.

      Знаки такие:

      - `+` сложить
      - `-` вычесть
      - `*` умножить (звёздочка, не буква «икс»)
      - `/` разделить

      ## А если в кавычках?

      Вот здесь новички спотыкаются:

      ```
      print("2 + 3")
      ```

      напечатает `2 + 3`, а не `5`. Кавычки означают «покажи как есть,
      не думай». Python честно показывает значки.

      **Запомни правило:** в кавычках — показать, без кавычек — посчитать.

      ## Порядок действий обычный

      Умножение и деление выполняются раньше сложения, как в школе.
      Скобки меняют порядок:

      ```
      print(2 + 3 * 4)     → 14
      print((2 + 3) * 4)   → 20
      ```
    examples:
      - caption: Считаем
        code: |
          print(2 + 3)
          print(10 - 4)
          print(6 * 7)
          print(20 / 4)
      - caption: Почувствуй разницу — запусти и сравни две строки
        code: |
          print(2 + 3)
          print("2 + 3")
    tasks:
      - id: t01_l03_t1
        ord: 1
        kind: template
        params:
          a: [17, 34, 56, 23, 48]
          b: [25, 19, 37, 44, 12]
        statement_md: |
          Пусть программа посчитает и напечатает, сколько будет

          **{a} + {b}**

          Не считай сам — пусть считает компьютер.
        starter_code: |
        solution: |
          print({a} + {b})
        concepts: [сложение]
        tests:
          - kind: stdout
            expect_expr: "a + b"
          - kind: ast
            require: [BinOp]
            hint: Внутри скобок должно быть именно вычисление, а не готовый ответ.

      - id: t01_l03_t2
        ord: 2
        kind: template
        params:
          коробок: [6, 8, 4, 7, 9]
          конфет: [12, 15, 20, 11, 25]
        statement_md: |
          В магазине {коробок} коробок, в каждой по {конфет} конфет.

          Пусть программа посчитает и напечатает общее число конфет.
        starter_code: |
        solution: |
          print({коробок} * {конфет})
        concepts: [умножение]
        tests:
          - kind: stdout
            expect_expr: "коробок * конфет"
            hint: Умножение записывается звёздочкой — `*`.
          - kind: ast
            require: [BinOp]
            hint: Пусть считает компьютер, а не ты.

      - id: t01_l03_t3
        ord: 3
        statement_md: |
          Напечатай **две** строки:

          1. результат вычисления `100 - 58`
          2. текст `100 - 58` — именно так, значками, без вычисления

          Должно получиться:

          ```
          42
          100 - 58
          ```
        starter_code: |
        solution: |
          print(100 - 58)
          print("100 - 58")
        concepts: [кавычки, число]
        tests:
          - kind: stdout
            expect: |
              42
              100 - 58
            hint: Первая строка без кавычек, вторая — в кавычках.
  # ======================================================================
  - id: t01_final
    ord: 4
    title: Задания по всей теме
    concepts: [print, число, кавычки]
    theory_md: |
      ## Проверим, что закрепилось

      Отдельные уроки позади. Теперь три задания, в каждом нужно
      вспомнить сразу несколько вещей из темы:

      - печать текста и чисел;
      - разницу между «в кавычках» и «без кавычек»;
      - вычисления внутри `print`;
      - чтение сообщения об ошибке.

      Подсказки работают как обычно: не получается — нажимай «Не понимаю».
      После этих заданий учитель подведёт итог темы и поставит оценку.
    tasks:
      - id: t01_final_t1
        ord: 1
        is_final: true
        statement_md: |
          Напечатай три строки подряд:

          ```
          Меня зовут Python
          2 + 2
          4
          ```

          Вторая строка — просто значки, третья — результат вычисления.
          Число 4 вписывать вручную нельзя, пусть считает программа.
        starter_code: |
        solution: |
          print("Меня зовут Python")
          print("2 + 2")
          print(2 + 2)
        concepts: [print, кавычки, число]
        tests:
          - kind: stdout
            expect: |
              Меня зовут Python
              2 + 2
              4
          - kind: ast
            require: [BinOp]
            hint: Последняя строка должна быть вычислением, а не готовой четвёркой.

      - id: t01_final_t2
        ord: 2
        is_final: true
        statement_md: |
          В коробке 24 карандаша, их раздали поровну 6 детям.

          Напечатай, сколько карандашей досталось каждому, в таком виде:

          ```
          Каждому по 4
          ```

          Число посчитай программой.
        starter_code: |
        solution: |
          print("Каждому по", 24 // 6)
        concepts: [деление, print]
        tests:
          - kind: stdout
            expect: "Каждому по 4"
            hint: Куски в print перечисляются через запятую.
          - kind: ast
            require: [BinOp]

      - id: t01_final_t3
        ord: 3
        is_final: true
        statement_md: |
          Перед тобой программа с двумя ошибками:

          ```
          prnt("Итого:)
          ```

          Почини её так, чтобы напечаталось:

          ```
          Итого: 100
          ```

          Число 100 тоже должно быть посчитано — например, как 25 умножить
          на 4.
        starter_code: |
          prnt("Итого:)
        solution: |
          print("Итого:", 25 * 4)
        concepts: [ошибка, кавычки, умножение]
        tests:
          - kind: stdout
            expect: "Итого: 100"
            hint: Ошибки две — в названии команды и в кавычках.
          - kind: ast
            require: [BinOp]
