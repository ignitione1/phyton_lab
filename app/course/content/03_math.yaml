topic:
  id: t03
  ord: 3
  title: Вычисления и красивый вывод

lessons:
  # ======================================================================
  - id: t03_l01
    ord: 1
    title: Деление и остаток
    concepts: [деление, остаток, целочисленное деление]
    theory_md: |
      ## Обычное деление

      ```
      print(10 / 2)
      ```

      напечатает `5.0`, а не `5`. Обрати внимание на точку с нулём.

      Деление в Python **всегда** даёт дробное число, даже когда делится
      нацело. Это не ошибка: Python не знает заранее, разделится ли ровно,
      и на всякий случай отвечает дробью.

      ## Деление нацело

      Иногда дробь не нужна. Сколько полных коробок по 3 яйца получится
      из 10 яиц? Ответ — 3 коробки, и ещё одно яйцо останется.

      Для этого есть два особых действия:

      ```
      print(10 // 3)   → 3     сколько раз поместилось целиком
      print(10 % 3)    → 1     что осталось
      ```

      - `//` — деление нацело, дробная часть просто отбрасывается;
      - `%` — остаток от деления.

      Знак `%` здесь не «процент», а именно остаток. Читается «десять
      по модулю три».

      ## Где это нужно на деле

      **Чётное число или нет.** Если остаток от деления на 2 равен нулю —
      число чётное:

      ```
      print(8 % 2)    → 0, значит чётное
      print(7 % 2)    → 1, значит нечётное
      ```

      **Разложить время.** 200 секунд — это сколько минут и секунд?

      ```
      print(200 // 60)   → 3 минуты
      print(200 % 60)    → 20 секунд
      ```

      ## Степень

      Два знака умножения подряд означают возведение в степень:

      ```
      print(2 ** 10)   → 1024
      ```

      ## Порядок действий

      Как в школе: сначала степень, потом умножение и деление, потом
      сложение и вычитание. Скобки меняют порядок.

      Если сомневаешься — **ставь скобки**. Лишние скобки ничего не портят,
      а читать код с ними проще.
    examples:
      - caption: Три вида деления
        code: |
          print(10 / 3)
          print(10 // 3)
          print(10 % 3)
      - caption: Раскладываем секунды
        code: |
          всего = 200
          print("Минут:", всего // 60)
          print("Секунд:", всего % 60)
      - caption: Степень
        code: |
          print(2 ** 10)
          print(5 ** 2)
    tasks:
      - id: t03_l01_t1
        ord: 1
        kind: template
        params:
          учеников: [27, 31, 25, 19, 33]
          мест: [2, 3, 2, 4, 3]
        statement_md: |
          В классе {учеников} учеников. Их рассаживают по партам,
          на каждой парте помещается {мест} человека.

          Напечатай, сколько парт будет **занято полностью**.
        starter_code: |
        solution: |
          print({учеников} // {мест})
        concepts: [целочисленное деление]
        tests:
          - kind: stdout
            expect_expr: "учеников // мест"
            hint: Нужно деление нацело — два знака деления подряд.
          - kind: ast
            require: [BinOp]
            hint: Пусть считает компьютер.

      - id: t03_l01_t2
        ord: 2
        statement_md: |
          Тех же 27 учеников рассаживают по 2 за парту.

          Напечатай, сколько человек останется без пары.

          Должно получиться:

          ```
          1
          ```
        starter_code: |
        solution: |
          print(27 % 2)
        concepts: [остаток]
        tests:
          - kind: stdout
            expect: "1"
            hint: Остаток от деления записывается знаком процента.
          - kind: ast
            require: [BinOp]

      - id: t03_l01_t3
        ord: 3
        statement_md: |
          Спроси число секунд вопросом `Секунды: ` и напечатай, сколько
          это минут и секунд, в таком виде (для ввода **200**):

          ```
          Секунды: 3 мин 20 сек
          ```
        starter_code: |
        solution: |
          всего = int(input("Секунды: "))
          print(всего // 60, "мин", всего % 60, "сек")
        concepts: [целочисленное деление, остаток, int]
        tests:
          - kind: stdout
            stdin: "200"
            expect: "Секунды: 3 мин 20 сек"
            hint: Минуты — деление нацело на 60, секунды — остаток.
          - kind: stdout
            stdin: "75"
            expect: "Секунды: 1 мин 15 сек"

  # ======================================================================
  - id: t03_l02
    ord: 2
    title: f-строки — текст с подстановкой
    concepts: [f-строка, формат]
    theory_md: |
      ## Проблема

      Мы печатали так:

      ```
      имя = "Аня"
      возраст = 25
      print("Меня зовут", имя, ", мне", возраст, "лет")
      ```

      Получится: `Меня зовут Аня , мне 25 лет`. Обрати внимание на
      **лишний пробел перед запятой** — Python ставит пробелы между всеми
      кусками, и убрать их так не получится.

      ## Решение: f-строка

      Если перед кавычками поставить букву `f`, внутри строки можно писать
      имена переменных в фигурных скобках:

      ```
      имя = "Аня"
      возраст = 25
      print(f"Меня зовут {имя}, мне {возраст} лет")
      ```

      Получится ровно то, что нужно: `Меня зовут Аня, мне 25 лет`.

      Буква `f` — от английского *format*, «собрать по образцу». Python
      берёт строку, находит в ней фигурные скобки и подставляет значения.

      ## Внутри скобок можно считать

      ```
      цена = 100
      print(f"Две штуки стоят {цена * 2} рублей")
      ```

      напечатает `Две штуки стоят 200 рублей`.

      ## Дробные числа можно округлять

      ```
      среднее = 10 / 3
      print(f"Получилось {среднее:.2f}")
      ```

      напечатает `Получилось 3.33`. Запись `:.2f` означает «оставь два
      знака после точки». Очень пригодится для денег и оценок.

      ## Когда что использовать

      - `print(a, b)` — когда нужно быстро что-то посмотреть;
      - f-строка — когда важно, как текст выглядит.

      Дальше в курсе будем пользоваться в основном f-строками.
    examples:
      - caption: Сравни два способа
        code: |
          имя = "Аня"
          возраст = 25
          print("Меня зовут", имя, ", мне", возраст, "лет")
          print(f"Меня зовут {имя}, мне {возраст} лет")
      - caption: Вычисление прямо в строке
        code: |
          цена = 100
          print(f"Две штуки стоят {цена * 2} рублей")
      - caption: Округление
        code: |
          среднее = 10 / 3
          print(f"Без округления: {среднее}")
          print(f"С округлением:  {среднее:.2f}")
    tasks:
      - id: t03_l02_t1
        ord: 1
        statement_md: |
          Даны переменные:

          ```
          товар = "хлеб"
          цена = 45
          ```

          Напечатай с помощью f-строки:

          ```
          Товар: хлеб, цена: 45 руб.
          ```
        starter_code: |
          товар = "хлеб"
          цена = 45
        solution: |
          товар = "хлеб"
          цена = 45
          print(f"Товар: {товар}, цена: {цена} руб.")
        concepts: [f-строка]
        tests:
          - kind: stdout
            expect: "Товар: хлеб, цена: 45 руб."
          - kind: ast
            require: [JoinedStr]
            hint: Здесь нужна именно f-строка — с буквой f перед кавычками.

      - id: t03_l02_t2
        ord: 2
        statement_md: |
          Спроси имя (`Имя: `) и возраст (`Возраст: `).

          Напечатай f-строкой (для ответов **Пётр** и **30**):

          ```
          Имя: Возраст: Пётр, через 5 лет тебе будет 35
          ```
        starter_code: |
        solution: |
          имя = input("Имя: ")
          возраст = int(input("Возраст: "))
          print(f"{имя}, через 5 лет тебе будет {возраст + 5}")
        concepts: [f-строка, int]
        tests:
          - kind: stdout
            stdin: |
              Пётр
              30
            expect: "Имя: Возраст: Пётр, через 5 лет тебе будет 35"
            hint: Внутри фигурных скобок можно не только подставлять, но и считать.
          - kind: ast
            require: [JoinedStr]

      - id: t03_l02_t3
        ord: 3
        statement_md: |
          Три оценки: 4, 5 и 3.

          Посчитай средний балл и напечатай его с двумя знаками после точки:

          ```
          Средний балл: 4.00
          ```
        starter_code: |
        solution: |
          среднее = (4 + 5 + 3) / 3
          print(f"Средний балл: {среднее:.2f}")
        concepts: [f-строка, деление]
        tests:
          - kind: stdout
            expect: "Средний балл: 4.00"
            hint: Округление записывается так — {значение:.2f}
          - kind: ast
            require: [BinOp]
            hint: Пусть среднее считает программа.
  # ======================================================================
  - id: t03_final
    ord: 3
    title: Задания по всей теме
    concepts: [остаток, f-строка, деление]
    theory_md: |
      ## Проверим, что закрепилось

      Тема дала два новых инструмента:

      - деление нацело `//` и остаток `%` — когда дробь не нужна;
      - f-строки — когда важно, как выглядит вывод.

      В заданиях ниже они работают вместе.
    tasks:
      - id: t03_final_t1
        ord: 1
        is_final: true
        statement_md: |
          Спроси число секунд (`Секунды: `) и напечатай f-строкой:

          ```
          Секунды: Это 2 мин 5 сек
          ```

          (для ввода **125**)
        starter_code: |
        solution: |
          всего = int(input("Секунды: "))
          print(f"Это {всего // 60} мин {всего % 60} сек")
        concepts: [остаток, f-строка]
        tests:
          - kind: stdout
            stdin: "125"
            expect: "Секунды: Это 2 мин 5 сек"
          - kind: stdout
            stdin: "60"
            expect: "Секунды: Это 1 мин 0 сек"
          - kind: ast
            require: [JoinedStr]
            hint: Вывод нужно собрать f-строкой.

      - id: t03_final_t2
        ord: 2
        is_final: true
        statement_md: |
          Спроси количество конфет (`Конфет: `) и число детей (`Детей: `).

          Напечатай f-строкой, сколько достанется каждому и сколько
          останется:

          ```
          Конфет: Детей: Каждому по 3, останется 2
          ```

          (для **20** конфет и **6** детей)
        starter_code: |
        solution: |
          конфет = int(input("Конфет: "))
          детей = int(input("Детей: "))
          print(f"Каждому по {конфет // детей}, останется {конфет % детей}")
        concepts: [остаток, f-строка, деление]
        tests:
          - kind: stdout
            stdin: |
              20
              6
            expect: "Конфет: Детей: Каждому по 3, останется 2"
          - kind: stdout
            stdin: |
              10
              5
            expect: "Конфет: Детей: Каждому по 2, останется 0"

      - id: t03_final_t3
        ord: 3
        is_final: true
        statement_md: |
          Три оценки: 5, 4 и 4.

          Напечатай f-строкой сумму и средний балл с двумя знаками:

          ```
          Сумма: 13, средний балл: 4.33
          ```

          Оба числа посчитай программой.
        starter_code: |
        solution: |
          сумма = 5 + 4 + 4
          print(f"Сумма: {сумма}, средний балл: {сумма / 3:.2f}")
        concepts: [f-строка, деление]
        tests:
          - kind: stdout
            expect: "Сумма: 13, средний балл: 4.33"
            hint: Округление записывается как {значение:.2f}
          - kind: ast
            require: [BinOp, JoinedStr]
