  - id: t05_final
    ord: 4
    title: Задания по всей теме
    concepts: [for, while, накопитель]
    theory_md: |
      ## Проверим, что закрепилось

      Циклы — самая важная тема курса. Напомню:

      - накопитель заводят **до** цикла, печатают **после**;
      - вторая граница `range` не включается;
      - `break` прекращает цикл, `continue` пропускает один повтор;
      - внутри `while` обязательно должно меняться то, от чего зависит
        условие, иначе цикл не кончится.
    tasks:
      - id: t05_final_t1
        ord: 1
        is_final: true
        statement_md: |
          Посчитай сумму всех **чётных** чисел от 1 до 100 и напечатай
          её в таком виде:

          ```
          Сумма чётных: 2550
          ```
        starter_code: |
        solution: |
          сумма = 0
          for число in range(1, 101):
              if число % 2 == 0:
                  сумма += число
          print(f"Сумма чётных: {сумма}")
        concepts: [for, накопитель, остаток]
        tests:
          - kind: ast
            require: [For, If]
          - kind: stdout
            expect: "Сумма чётных: 2550"

      - id: t05_final_t2
        ord: 2
        is_final: true
        statement_md: |
          Спроси число (`Число: `) и напечатай таблицу умножения на него
          от 1 до 5.

          Для **7**:

          ```
          Число: 7 x 1 = 7
          7 x 2 = 14
          7 x 3 = 21
          7 x 4 = 28
          7 x 5 = 35
          ```
        starter_code: |
        solution: |
          n = int(input("Число: "))
          for i in range(1, 6):
              print(f"{n} x {i} = {n * i}")
        concepts: [for, f-строка, input]
        tests:
          - kind: ast
            require: [For]
          - kind: stdout
            stdin: "7"
            expect: |
              Число: 7 x 1 = 7
              7 x 2 = 14
              7 x 3 = 21
              7 x 4 = 28
              7 x 5 = 35

      - id: t05_final_t3
        ord: 3
        is_final: true
        statement_md: |
          Найди наименьшее число больше 100, которое делится на 17
          без остатка, и напечатай его.

          Должно получиться:

          ```
          102
          ```

          Как только нашёл — прекрати поиск.
        starter_code: |
        solution: |
          for число in range(101, 1000):
              if число % 17 == 0:
                  print(число)
                  break
        concepts: [for, break, остаток]
        tests:
          - kind: ast
            require: [For, If]
          - kind: stdout
            expect: "102"
            hint: Начни перебор со 101 и прерви цикл на первом подходящем.
