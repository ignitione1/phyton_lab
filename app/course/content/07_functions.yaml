topic:
  id: t07
  ord: 7
  title: Функции — свои команды

lessons:
  # ======================================================================
  - id: t07_l01
    ord: 1
    title: Своя команда
    concepts: [функция, def, вызов]
    theory_md: |
      ## Мы уже ими пользовались

      `print`, `input`, `len`, `sorted` — это функции. Кто-то их написал,
      а мы вызываем по имени.

      Теперь научимся делать свои.

      ## Зачем

      Допустим, в программе три раза нужно поздороваться с человеком
      и объяснить правила. Каждый раз — пять строк. Всего пятнадцать,
      и если понадобится поправить формулировку, править придётся в трёх
      местах, не забыв ни одного.

      Функция позволяет написать один раз, а вызывать сколько угодно.

      ## Как объявить

      ```
      def поздороваться():
          print("Здравствуй!")
          print("Рад тебя видеть.")
      ```

      Разберём:

      - `def` — от *define*, «определить». Слово, с которого начинается
        объявление;
      - `поздороваться` — имя, придумываешь сам, по тем же правилам,
        что и для переменных;
      - `()` — круглые скобки, пока пустые;
      - `:` — двоеточие;
      - отступ — тело функции, то, что она делает.

      ## Объявить ≠ выполнить

      Важная тонкость. Если написать только это, **ничего не напечатается**.
      Объявление — как записать рецепт: он лежит, но никто не готовит.

      Чтобы функция сработала, её надо **вызвать** — написать имя
      со скобками:

      ```
      def поздороваться():
          print("Здравствуй!")

      поздороваться()
      поздороваться()
      ```

      Заметь: вызов без отступа, он уже вне функции. И напечатается
      два раза.

      ## Функция с данными

      Чаще функции что-то дают на вход:

      ```
      def поздороваться(имя):
          print(f"Здравствуй, {имя}!")

      поздороваться("Аня")
      поздороваться("Пётр")
      ```

      `имя` в скобках — **параметр**. Внутри функции он ведёт себя как
      обычная переменная, а значение попадает в него при вызове.

      ## Несколько параметров

      ```
      def представить(имя, возраст):
          print(f"{имя}, {возраст} лет")

      представить("Аня", 25)
      ```

      Порядок важен: первое значение попадёт в первый параметр.

      ## Где объявлять

      Функции объявляют **до** того, как вызывают, — обычно вверху файла.
      Python читает сверху вниз и должен успеть узнать про функцию
      раньше, чем встретит вызов.
    examples:
      - caption: Объявили и вызвали дважды
        code: |
          def поздороваться():
              print("Здравствуй!")
              print("Рад тебя видеть.")

          поздороваться()
          поздороваться()
      - caption: С параметром
        code: |
          def поздороваться(имя):
              print(f"Здравствуй, {имя}!")

          поздороваться("Аня")
          поздороваться("Пётр")
      - caption: Объявили, но не вызвали — ничего не произойдёт
        code: |
          def поздороваться():
              print("Здравствуй!")

          print("Программа закончилась")
    tasks:
      - id: t07_l01_t1
        ord: 1
        statement_md: |
          Объяви функцию с именем `привет`, которая печатает слово
          `Привет!`, и вызови её **три раза**.

          Должно получиться:

          ```
          Привет!
          Привет!
          Привет!
          ```
        starter_code: |
          def привет():
        solution: |
          def привет():
              print("Привет!")

          привет()
          привет()
          привет()
        concepts: [функция, def, вызов]
        tests:
          - kind: ast
            require: [FunctionDef]
            hint: Нужно объявить функцию через def.
          - kind: stdout
            expect: |
              Привет!
              Привет!
              Привет!
            hint: Объявить мало — функцию надо ещё и вызвать.

      - id: t07_l01_t2
        ord: 2
        statement_md: |
          Объяви функцию `поздравить`, которая принимает имя и печатает:

          ```
          С днём рождения, Аня!
          ```

          Вызови её для имён **Аня** и **Пётр**.

          Должно получиться:

          ```
          С днём рождения, Аня!
          С днём рождения, Пётр!
          ```
        starter_code: |
        solution: |
          def поздравить(имя):
              print(f"С днём рождения, {имя}!")

          поздравить("Аня")
          поздравить("Пётр")
        concepts: [функция, параметр]
        tests:
          - kind: ast
            require: [FunctionDef]
          - kind: stdout
            expect: |
              С днём рождения, Аня!
              С днём рождения, Пётр!

      - id: t07_l01_t3
        ord: 3
        statement_md: |
          Объяви функцию `рамка`, которая принимает текст и печатает
          его между двумя строками из дефисов:

          ```
          ---
          привет
          ---
          ```

          Вызови её с текстом **привет**.
        starter_code: |
        solution: |
          def рамка(текст):
              print("---")
              print(текст)
              print("---")

          рамка("привет")
        concepts: [функция, параметр]
        tests:
          - kind: ast
            require: [FunctionDef]
          - kind: stdout
            expect: |
              ---
              привет
              ---

  # ======================================================================
  - id: t07_l02
    ord: 2
    title: Функция возвращает результат
    concepts: [return, результат]
    theory_md: |
      ## Печатать и возвращать — разное

      Сравни две функции:

      ```
      def сложить_и_напечатать(a, b):
          print(a + b)

      def сложить(a, b):
          return a + b
      ```

      Первая печатает результат на экран — и всё, дальше им воспользоваться
      нельзя.

      Вторая **возвращает** его. Результат можно положить в переменную,
      использовать в вычислениях, передать дальше:

      ```
      итог = сложить(2, 3)
      print(итог * 10)      → 50
      ```

      Со второй так можно, с первой — нет.

      ## Слово return

      `return` делает две вещи сразу:

      1. отдаёт значение туда, откуда функцию вызвали;
      2. **немедленно заканчивает** работу функции.

      Всё, что написано после `return`, не выполнится:

      ```
      def проверить(число):
          if число > 0:
              return "Положительное"
          return "Не положительное"
      ```

      Если число больше нуля — вернётся первое, и до второй строки дело
      не дойдёт. Поэтому здесь и не нужен `else`.

      ## Функция без return

      Если `return` нет, функция всё равно что-то возвращает — особое
      значение `None`, означающее «ничего»:

      ```
      def поздороваться():
          print("Привет")

      результат = поздороваться()
      print(результат)      → None
      ```

      Это частая путаница у начинающих: функция напечатала, но вернула
      `None`. Если результат нужен дальше — пиши `return`.

      ## Своя переменная внутри

      Переменные, созданные внутри функции, живут только там:

      ```
      def посчитать():
          промежуточный = 42
          return промежуточный

      print(посчитать())      → 42
      print(промежуточный)    → ошибка, снаружи такого имени нет
      ```

      Это хорошо: функция не мешает остальной программе, и можно
      не бояться совпадения имён.

      ## Хорошее правило

      Функция, которая **считает**, пусть возвращает результат.
      Функция, которая **показывает**, пусть печатает. Смешивать одно
      с другим — значит потом жалеть.
    examples:
      - caption: Возвращаем результат
        code: |
          def сложить(a, b):
              return a + b

          итог = сложить(2, 3)
          print(итог)
          print(итог * 10)
      - caption: return заканчивает функцию
        code: |
          def проверить(число):
              if число > 0:
                  return "Положительное"
              return "Не положительное"

          print(проверить(5))
          print(проверить(-5))
      - caption: Без return получается None
        code: |
          def поздороваться():
              print("Привет")

          результат = поздороваться()
          print(результат)
    tasks:
      - id: t07_l02_t1
        ord: 1
        statement_md: |
          Напиши функцию `удвоить`, которая принимает число и **возвращает**
          его, умноженное на два.

          Печатать внутри функции не нужно — именно вернуть.

          Проверка вызовет твою функцию сама.
        starter_code: |
          def удвоить(число):
        solution: |
          def удвоить(число):
              return число * 2
        concepts: [return, функция]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
            hint: Внутри функции нужно слово return, а не print.
          - kind: call
            func: удвоить
            args: [5]
            expect_value: 10
          - kind: call
            func: удвоить
            args: [0]
            expect_value: 0
          - kind: call
            func: удвоить
            args: [-3]
            expect_value: -6

      - id: t07_l02_t2
        ord: 2
        kind: template
        params:
          x: [3, 5, 6, 8, 9]
          y: [4, 7, 2, 11, 5]
        statement_md: |
          Напиши функцию `площадь`, которая принимает длину и ширину
          прямоугольника и возвращает его площадь.

          Например, для сторон {x} и {y} она должна вернуть
          их произведение.
        starter_code: |
        solution: |
          def площадь(длина, ширина):
              return длина * ширина
        concepts: [return, параметр]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: площадь
            args_expr: ["x", "y"]
            value_expr: "x * y"
          - kind: call
            func: площадь
            args: [10, 10]
            expect_value: 100
          - kind: call
            func: площадь
            args: [1, 7]
            expect_value: 7

      - id: t07_l02_t3
        ord: 3
        statement_md: |
          Напиши функцию `чётное`, которая принимает число и возвращает
          `True`, если оно чётное, и `False`, если нечётное.

          Слова `True` и `False` писать вручную не нужно — сравнение
          само даёт такой ответ.
        starter_code: |
        solution: |
          def чётное(число):
              return число % 2 == 0
        concepts: [return, сравнение, остаток]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: чётное
            args: [8]
            expect_value: true
          - kind: call
            func: чётное
            args: [7]
            expect_value: false
          - kind: call
            func: чётное
            args: [0]
            expect_value: true

  # ======================================================================
  - id: t07_l03
    ord: 3
    title: Функции посложнее
    concepts: [функция, список, цикл]
    theory_md: |
      ## Функция, работающая со списком

      Параметром может быть что угодно, в том числе список:

      ```
      def среднее(числа):
          return sum(числа) / len(числа)

      print(среднее([5, 4, 3]))     → 4.0
      ```

      ## Функция с циклом внутри

      ```
      def сумма_чётных(числа):
          итог = 0
          for число in числа:
              if число % 2 == 0:
                  итог += число
          return итог

      print(сумма_чётных([1, 2, 3, 4, 5, 6]))    → 12
      ```

      Обрати внимание на отступы — их здесь четыре уровня:

      1. тело функции,
      2. тело цикла,
      3. тело условия,
      4. действие.

      И `return` стоит **вне цикла**. Если поставить его внутрь, функция
      закончится на первом же повторе.

      ## Значение по умолчанию

      Параметру можно задать значение, которое подставится, если при
      вызове ничего не передали:

      ```
      def поздороваться(имя, приветствие="Привет"):
          print(f"{приветствие}, {имя}!")

      поздороваться("Аня")                      → Привет, Аня!
      поздороваться("Аня", "Добрый вечер")      → Добрый вечер, Аня!
      ```

      Параметры со значением по умолчанию идут **после** обычных.

      ## Функция вызывает функцию

      Это совершенно нормально и очень распространено:

      ```
      def квадрат(x):
          return x * x

      def сумма_квадратов(a, b):
          return квадрат(a) + квадрат(b)

      print(сумма_квадратов(3, 4))    → 25
      ```

      Так большие задачи разбивают на маленькие понятные куски. Это,
      пожалуй, главный приём во всём программировании: не решать сложное
      целиком, а складывать из простого.
    examples:
      - caption: Функция со списком
        code: |
          def среднее(числа):
              return sum(числа) / len(числа)

          print(среднее([5, 4, 3]))
      - caption: Цикл внутри функции
        code: |
          def сумма_чётных(числа):
              итог = 0
              for число in числа:
                  if число % 2 == 0:
                      итог += число
              return итог

          print(сумма_чётных([1, 2, 3, 4, 5, 6]))
      - caption: Значение по умолчанию
        code: |
          def поздороваться(имя, приветствие="Привет"):
              print(f"{приветствие}, {имя}!")

          поздороваться("Аня")
          поздороваться("Аня", "Добрый вечер")
      - caption: Функция вызывает функцию
        code: |
          def квадрат(x):
              return x * x

          def сумма_квадратов(a, b):
              return квадрат(a) + квадрат(b)

          print(сумма_квадратов(3, 4))
    tasks:
      - id: t07_l03_t1
        ord: 1
        statement_md: |
          Напиши функцию `наибольшее`, которая принимает список чисел
          и возвращает самое большое из них.

          Можно воспользоваться готовым действием для поиска наибольшего.
        starter_code: |
          def наибольшее(числа):
        solution: |
          def наибольшее(числа):
              return max(числа)
        concepts: [функция, список]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: наибольшее
            args: [[3, 7, 2]]
            expect_value: 7
          - kind: call
            func: наибольшее
            args: [[-5, -1, -9]]
            expect_value: -1
          - kind: call
            func: наибольшее
            args: [[42]]
            expect_value: 42

      - id: t07_l03_t2
        ord: 2
        statement_md: |
          Напиши функцию `сколько_больше`, которая принимает список чисел
          и границу, а возвращает, сколько чисел в списке больше этой
          границы.

          Например, для списка `[1, 5, 8, 12]` и границы `4` ответ `3`.
        starter_code: |
          def сколько_больше(числа, граница):
        solution: |
          def сколько_больше(числа, граница):
              счётчик = 0
              for число in числа:
                  if число > граница:
                      счётчик += 1
              return счётчик
        concepts: [функция, цикл, счётчик]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For]
            hint: Понадобится цикл внутри функции.
          - kind: call
            func: сколько_больше
            args: [[1, 5, 8, 12], 4]
            expect_value: 3
          - kind: call
            func: сколько_больше
            args: [[1, 2, 3], 10]
            expect_value: 0
          - kind: call
            func: сколько_больше
            args: [[10, 20], 5]
            expect_value: 2

      - id: t07_l03_t3
        ord: 3
        statement_md: |
          Напиши функцию `только_чётные`, которая принимает список чисел
          и возвращает **новый список** только из чётных.

          Для `[1, 2, 3, 4, 5, 6]` должно вернуться `[2, 4, 6]`.
        starter_code: |
        solution: |
          def только_чётные(числа):
              результат = []
              for число in числа:
                  if число % 2 == 0:
                      результат.append(число)
              return результат
        concepts: [функция, фильтр, append]
        tests:
          - kind: ast
            require: [FunctionDef, Return, For]
          - kind: call
            func: только_чётные
            args: [[1, 2, 3, 4, 5, 6]]
            expect_value: [2, 4, 6]
          - kind: call
            func: только_чётные
            args: [[1, 3, 5]]
            expect_value: []
          - kind: call
            func: только_чётные
            args: [[2, 4]]
            expect_value: [2, 4]
  # ======================================================================
  - id: t07_final
    ord: 4
    title: Задания по всей теме
    concepts: [функция, return, параметр]
    theory_md: |
      ## Проверим, что закрепилось

      Функции — то, чем большие задачи разбивают на маленькие. Главное:

      - `print` показывает, `return` отдаёт значение для дальнейшей работы;
      - `return` немедленно заканчивает функцию;
      - переменные внутри функции снаружи не видны;
      - объявить — не значит выполнить, функцию надо вызвать.
    tasks:
      - id: t07_final_t1
        ord: 1
        is_final: true
        statement_md: |
          Напиши функцию `среднее`, которая принимает список чисел
          и возвращает их среднее значение.

          Для `[4, 5, 3]` должно вернуться `4.0`.
        starter_code: |
          def среднее(числа):
        solution: |
          def среднее(числа):
              return sum(числа) / len(числа)
        concepts: [функция, return, список]
        tests:
          - kind: ast
            require: [FunctionDef, Return]
          - kind: call
            func: среднее
            args: [[4, 5, 3]]
            expect_value: 4.0
          - kind: call
            func: среднее
            args: [[10]]
            expect_value: 10.0
          - kind: call
            func: среднее
            args: [[2, 4]]
            expect_value: 3.0

      - id: t07_final_t2
        ord: 2
        is_final: true
        statement_md: |
          Напиши функцию `оценка_словом`, которая принимает число от 2 до 5
          и возвращает его название:

          - 5 → `отлично`
          - 4 → `хорошо`
          - 3 → `удовлетворительно`
          - всё остальное → `плохо`
        starter_code: |
        solution: |
          def оценка_словом(балл):
              if балл == 5:
                  return "отлично"
              elif балл == 4:
                  return "хорошо"
              elif балл == 3:
                  return "удовлетворительно"
              return "плохо"
        concepts: [функция, return, elif]
        tests:
          - kind: ast
            require: [FunctionDef, Return, If]
          - kind: call
            func: оценка_словом
            args: [5]
            expect_value: "отлично"
          - kind: call
            func: оценка_словом
            args: [3]
            expect_value: "удовлетворительно"
          - kind: call
            func: оценка_словом
            args: [2]
            expect_value: "плохо"

      - id: t07_final_t3
        ord: 3
        is_final: true
        statement_md: |
          Напиши функцию `сумма_в_промежутке`, которая принимает два числа
          и возвращает сумму всех целых чисел между ними **включительно**.

          Для `2` и `5` это `2 + 3 + 4 + 5`, то есть `14`.
        starter_code: |
          def сумма_в_промежутке(начало, конец):
        solution: |
          def сумма_в_промежутке(начало, конец):
              итог = 0
              for число in range(начало, конец + 1):
                  итог += число
              return итог
